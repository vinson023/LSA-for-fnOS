IOP_LOGINFO_CODE_CIDL_ACT_OFFLINE_NOT_PENDING = 收到取消脱机激活的请求，但没有待处理的脱机激活。
IOP_LOGINFO_CODE_CIDL_IMAGE_REPAIR_IN_PROGRESS = 映像修复正在进行中。
IOP_LOGINFO_CODE_CIDL_ACT_VALIDATE_EFUSE_FULL = 激活验证 - 没有可用的 efuse 插槽。
IOP_LOGINFO_CODE_CIDL_ACT_VALIDATE_NON_GCA = 激活验证 - 不允许从 RC/GCA/Point 级别更新到低于 RC 级别。
IOP_LOGINFO_CODE_CIDL_ACT_VALIDATE_FEATCHK_SANITIZE_SUPPORT = 激活验证 - 不允许更新，因为某些磁盘正在进行安全擦除，而新固件不支持安全擦除。
IOP_LOGINFO_CODE_CIDL_ACT_VALIDATE_FEATCHK_SED_PASSTHROUGH = 激活验证 - 不允许更新，因为 JBOD 上的 SED 直通已启用，并且在 FDE 磁盘上配置了 JBOD。
IOP_LOGINFO_CODE_CIDL_ACT_VALIDATE_FEATCHK_WSUNMAP_SUPPORT = 激活验证 - 不允许更新：某些虚拟磁盘配置了 Write Same UNMAP，新固件不支持该功能。
IOP_LOGINFO_CODE_CIDL_ACT_VALIDATE_SVN_IMAGE_AUTH_FAIL = 激活验证 - 安全版本检查失败。  新映像版本低于当前映像版本。 
IOP_LOGINFO_CODE_CIDL_ACT_VALIDATE_SVN_SOTP_AUTH_FAIL = 激活验证 - 安全版本检查失败。  新映像版本低于 SOTP (efuse) 当前版本。
IOP_LOGINFO_CODE_CIDL_ACT_VALIDATE_FEATCHK_SMR_SUPPORT = 激活验证 - 不允许更新。存在 SMR 磁盘，但新固件不支持 SMR 磁盘。
IOP_LOGINFO_CODE_CIDL_ACT_VALIDATE_FEATCHK_LD_ERASE_RESUME_FIX_SUPPORT = 激活验证 - 不允许更新，因为虚拟磁盘擦除正在进行中，而新固件缺少恢复该操作所需的修复，可能无法正确恢复。
IOP_LOGINFO_CODE_CIDL_ACT_VALIDATE_FEATCHK_EVP_SASSATA_PROFILE_SUPPORT = 激活验证 - 不允许更新：新固件不支持仅 EVP SAS/SATA 配置文件。
IOP_LOGINFO_CODE_CIDL_ACT_VALIDATE_TROMBONE_ENCL_SUPPORT = 激活验证 - 不允许更新：新固件不支持 Trombone 磁盘柜。

