  <h1 class="title topictitle1" id="v9895667__v9895668">启动和停止定位虚拟磁盘</h1>
  
  <div class="body taskbody" id="v9895667__v9895681">
    <section class="section context" id="v9895667__v9895682">
      <p class="p" id="v9895667__v9895940">如果虚拟磁盘中的磁盘位于磁盘柜内，您可以通过其 LED 闪烁来识别它们。执行以下步骤来识别虚拟磁盘：</p>
    </section>
    <ol class="ol steps" id="v9895667__v9895683"><li class="li step stepexpand" id="v9895667__v9895684">
        <span class="ph cmd" id="v9895667__v9896055">导航到控制器仪表板，然后单击磁盘组名称（例如，<span class="ph uicontrol" id="v9895667__v9896056">DG_1</span>），然后单击磁盘组对应的图标以显示其内容。</span>
        <div class="itemgroup stepresult" id="v9895667__v9897091">将显示与所选磁盘组关联的虚拟磁盘和物理磁盘。</div>
      </li><li class="li step stepexpand" id="v9895667__v9895942">
        <span class="ph cmd" id="v9895667__v9895943">单击要在磁盘柜中定位的虚拟磁盘。</span>
      </li><li class="li step stepexpand" id="v9895667__v9895944">
        <span class="ph cmd" id="v9895667__v9895945">选择 <span class="ph menucascade" id="v9895667__v9895946"><span class="ph uicontrol" id="v9895667__v9895947">操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9895667__v9895948">开始定位</span></span>。</span>
        <div class="itemgroup stepresult" id="v9895667__v9895949">虚拟磁盘中磁盘上的 LED 开始闪烁。</div>
      </li><li class="li step stepexpand" id="v9895667__v9895950">
        <span class="ph cmd" id="v9895667__v9895951">选择 <span class="ph menucascade" id="v9895667__v9895952"><span class="ph uicontrol" id="v9895667__v9895953">操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9895667__v9895954">停止定位</span></span>，停止 LED 闪烁。</span>
      </li></ol>
  </div>
