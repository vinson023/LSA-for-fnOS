<html lang="en"><head><meta charset="UTF-8"><meta name="copyright" content="(C) Copyright 2020"><meta name="DC.rights.owner" content="(C) Copyright 2020"><meta name="DC.Type" content="concept"><meta name="DC.Coverage" content="audience ="><meta name="DC.Coverage" content="platform ="><meta name="DC.Coverage" content="product ="><meta name="DC.Relation" scheme="URI" content="../content/v11136571.html"><meta name="DC.Relation" scheme="URI" content="../content/v11569050.html"><meta name="DC.Relation" scheme="URI" content="../content/v11569087.html"><meta name="prodname" content="Add list of products or documents where this topic is used."><meta name="version" content="version attribute"><meta name="olh" content="LSA_help_running_consistency_check"><meta name="DC.Format" content="XHTML"><meta name="DC.Identifier" content="v11569032"><link rel="stylesheet" type="text/css" href="../commonltr.css"><title>运行一致性检查</title></head><body id="v11569032"><main role="main"><article role="article" aria-labelledby="v11569032__v11569033"><h1 class="title topictitle1" id="v11569032__v11569033">运行一致性检查</h1><div class="body conbody" id="v11569032__v11569046"><p class="p" id="v11569032__v11569047">您应定期对容错虚拟磁盘（RAID 1、5、6、10、50、60、1E 和跨区 RAID 1E 配置；RAID 0 不提供数据冗余）运行一致性检查。一致性检查扫描虚拟磁盘以确定数据是否已损坏并需要恢复。</p><p class="p" id="v11569032__v11569048">要运行一致性检查，请首先设置一致性检查属性，然后安排一致性检查。</p><div class="note note note_note" id="v11569032__v11569147"><span class="note__title">注意：</span> <p class="p" id="v11569032__v11569148">IT控制器不支持运行一致性检查功能。</p></div></div><nav role="navigation" class="related-links"><ul class="ullinks"><li class="link ulchildlink"><strong><a href="../content/v11569050.html">设置一致性检查属性</a></strong><br></li><li class="link ulchildlink"><strong><a href="../content/v11569087.html">安排一致性检查</a></strong><br></li></ul><div class="familylinks"><div class="parentlink"><strong>父主题：</strong> <a class="link" href="../content/v11136571.html">管理控制器</a></div></div></nav></article></main></body></html>
