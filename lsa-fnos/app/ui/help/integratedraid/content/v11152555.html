<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="copyright" content="(C) Copyright 2020"><meta name="DC.rights.owner" content="(C) Copyright 2020"><meta name="DC.Type" content="task"><meta name="DC.Relation" scheme="URI" content="../content/v11109282.html"><meta name="olh" content="LSA_help_import_clear_configuration"><meta name="DC.Format" content="XHTML"><meta name="DC.Identifier" content="v11152555"><link rel="stylesheet" type="text/css" href="../commonltr.css"><title>导入或清除外来配置</title></head><body id="v11152555"><main role="main"><article role="article" aria-labelledby="v11152555__v11152556"><h1 class="title topictitle1" id="v11152555__v11152556">导入或清除外来配置</h1><div class="body taskbody" id="v11152555__v11152560"><section class="section context" id="v11152555__v11152561"><p class="p" id="v11152555__v11152562">外来配置是存在于安装在计算机系统中的一组替换磁盘上的 RAID 配置。您可以使用 LSI 存储管理软件将外来配置导入控制器或清除外来配置，以便可以使用这些磁盘创建新配置。</p><p class="p" id="v11152555__v11152563">执行以下步骤导入或清除外来配置。</p></section><ol class="ol steps" id="v11152555__v11152564"><li class="li step stepexpand" id="v11152555__v11152565"><span class="ph cmd" id="v11152555__v11152566">导航到控制器仪表板。</span></li><li class="li step stepexpand" id="v11152555__v11152567"><span class="ph cmd" id="v11152555__v11152568">单击 <span class="ph uicontrol" id="v11152555__v11152569">配置</span>，然后单击 <span class="ph uicontrol" id="v11152555__v11152570">外来配置</span>。</span><div class="itemgroup info" id="v11152555__v11152571">将显示 <span class="keyword wintitle" id="v11152555__v11152572">外来配置</span> 窗口，其中列出了所有外来配置。</div></li><li class="li step stepexpand" id="v11152555__v11152573"><span class="ph cmd" id="v11152555__v11152574">单击以下选项之一：</span><ul class="ul choices" id="v11152555__v11152575"><li class="li choice" id="v11152555__v11152576"><span class="ph uicontrol" id="v11152555__v11152577">全部导入</span>：从所有外来磁盘导入外来配置。</li><li class="li choice" id="v11152555__v11152578"><span class="ph uicontrol" id="v11152555__v11152579">全部清除</span>：清除所有外来磁盘上的配置。</li></ul></li><li class="li step stepexpand" id="v11152555__v11152580"><span class="ph cmd" id="v11152555__v11152581">单击 <span class="ph uicontrol" id="v11152555__v11152582">重新扫描</span> 刷新窗口。</span></li></ol></div><nav role="navigation" class="related-links"><div class="familylinks"><div class="parentlink"><strong>父主题：</strong> <a class="link" href="../content/v11109282.html">配置</a></div></div></nav></article></main></body></html>
