  <h1 class="title topictitle1" id="v10563085__v10563086">删除托管服务器</h1>
  
  <div class="body taskbody" id="v10563085__v10563099">
    <section class="section context" id="v10563085__v10563100">
      <p class="p" id="v10563085__v10563155">从以下位置执行以下步骤 <span class="ph uicontrol" id="v10563085__v11053249">管理服务器</span> 页面以删除托管服务器。</p>
      <p class="p" id="v10563085__v12844966">单击 <img class="image" height="15" width="15" src="LSA_remove_managed_server_icon.png"> 图标。</p>
      <p class="p" id="v10563085__v12844968">该主机将从受管服务器列表中删除。<img class="image" height="15" width="15" src="LSA_remove_managed_server_icon.png">  图标更改为 <img class="image" height="15" width="15" src="LSA_add_managed_server_icon.png"> 图标。</p>
    </section>
  </div>
