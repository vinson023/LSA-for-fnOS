<html lang="en"><head><meta charset="UTF-8"><meta name="copyright" content="(C) Copyright 2020"><meta name="DC.rights.owner" content="(C) Copyright 2020"><meta name="DC.Type" content="task"><meta name="DC.Coverage" content="audience ="><meta name="DC.Coverage" content="platform ="><meta name="DC.Coverage" content="product ="><meta name="DC.Relation" scheme="URI" content="../content/v11137041.html"><meta name="prodname" content="Add list of products or documents where this topic is used."><meta name="version" content="version attribute"><meta name="olh" content="LSA_help_starting_consistency_check_virtual_drive"><meta name="DC.Format" content="XHTML"><meta name="DC.Identifier" content="v11568995"><link rel="stylesheet" type="text/css" href="../commonltr.css"><title>在虚拟磁盘上启动一致性检查</title></head><body id="v11568995"><main role="main"><article role="article" aria-labelledby="v11568995__v11568996"><h1 class="title topictitle1" id="v11568995__v11568996">在虚拟磁盘上启动一致性检查</h1><div class="body taskbody" id="v11568995__v11569009"><section class="section context" id="v11568995__v11569010">执行以下步骤以启动虚拟磁盘上的一致性检查。有关一致性检查的更多信息，请参阅 <a class="xref fm:SectionNumText" href="v11569032.html#v11569032">运行一致性检查</a>。<div class="note note note_note" id="v11568995__v11569030"><span class="note__title">注意：</span> <p class="p" id="v11568995__v11569031">IT 控制器不支持一致性检查功能。</p></div></section><ol class="ol steps" id="v11568995__v11569012"><li class="li step stepexpand" id="v11568995__v11569013"><span class="ph cmd" id="v11568995__v11569014">导航到控制器仪表板，单击磁盘组名称（例如，<span class="ph uicontrol" id="v11568995__v11569015">DG_1</span>）。单击磁盘组对应的图标即可显示其内容。</span><div class="itemgroup info" id="v11568995__v11569017">将显示与所选磁盘组关联的虚拟磁盘和物理磁盘。</div></li><li class="li step stepexpand" id="v11568995__v11569018"><span class="ph cmd" id="v11568995__v11569019">单击要启动一致性检查的虚拟磁盘。</span></li><li class="li step stepexpand" id="v11568995__v11569020"><span class="ph cmd" id="v11568995__v11569021">选择 <span class="ph menucascade" id="v11568995__v11569022"><span class="ph uicontrol" id="v11568995__v11569023">操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v11568995__v11569024">开始一致性检查</span></span>。</span><div class="itemgroup stepresult" id="v11568995__v11569025">一致性检查操作开始。您可以在 <span class="keyword wintitle" id="v11568995__v11569026">后台进程正在进行中</span> 部分查看此操作的进度。一致性检查操作开始后，<span class="ph uicontrol" id="v11568995__v11569028">操作</span> 菜单中的 <span class="ph uicontrol" id="v11568995__v11569027">停止一致性检查</span> 选项将启用。</div></li></ol></div><nav role="navigation" class="related-links"><div class="familylinks"><div class="parentlink"><strong>父主题：</strong> <a class="link" href="../content/v11137041.html">管理虚拟磁盘</a></div></div></nav></article></main></body></html>
