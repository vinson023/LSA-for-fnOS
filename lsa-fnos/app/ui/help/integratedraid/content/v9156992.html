  <h1 class="title topictitle1" id="v9156992__v9156993">清除事件日志</h1>
  
  <div class="body taskbody" id="v9156992__v9157006">
    <section class="section context" id="v9156992__v9157007">
      <p class="p" id="v9156992__v9371948">执行以下步骤来清除事件日志。</p>
    </section>
    <ol class="ol steps" id="v9156992__v9157008"><li class="li step stepexpand" id="v9156992__v9157009">
        <span class="ph cmd" id="v9156992__v9157010">单击 <span class="ph uicontrol" id="v9156992__v9371950">清除日志</span> 在 <span class="ph uicontrol" id="v9156992__v9371949">查看事件日志</span> 窗口。</span>
        <div class="itemgroup stepresult" id="v9156992__v9371951">出现确认对话框。</div>
      </li><li class="li step stepexpand" id="v9156992__v9371952">
        <span class="ph cmd" id="v9156992__v9371953">选择 <span class="ph uicontrol" id="v9156992__v9371954">确认</span>，然后单击 <span class="ph uicontrol" id="v9156992__v9371955">是，清除日志</span>。</span>
        <div class="itemgroup stepresult" id="v9156992__v9371956">事件日志被清除。</div>
      </li></ol>
  </div>
