  <h1 class="title topictitle1" id="v9156950__v9156951">查看事件日志</h1>
  
  <div class="body taskbody" id="v9156950__v9156964">
    <section class="section context" id="v9156950__v9156965">
      <p class="p" id="v9156950__v9371937">LSI 存储管理软件监控服务器及其连接的所有控制器卡的活动和性能。执行以下步骤来查看事件日志。</p>
    </section>
    <ol class="ol steps" id="v9156950__v9156966"><li class="li step stepexpand" id="v9156950__v9156967">
        <span class="ph cmd" id="v9156950__v9156968">选择 <span class="ph menucascade" id="v9156950__v11133691"><span class="ph uicontrol" id="v9156950__v11133692">操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9156950__v11133693">查看事件日志</span></span> 在服务器仪表板或控制器仪表板中。</span>
        <div class="itemgroup stepresult" id="v9156950__v9371939"><span class="keyword wintitle" id="v9156950__v9528507">查看事件日志</span> 出现显示事件列表的窗口。每个条目都有一个事件 ID、指示事件严重性的严重性级别、日期和时间条目以及事件的简要描述。事件日志按日期和时间按时间顺序排序。
          <figure class="fig fignone" id="v9156950__v9374237"><figcaption><span class="fig--title-label">图 1. </span>查看事件日志窗口</figcaption>
            
            
          </figure>
        </div>
      </li><li class="li step stepexpand" id="v9156950__v11484413">
        <span class="ph cmd" id="v9156950__v11484414">（可选）在同一页面中单击 <span class="ph uicontrol" id="v9156950__v11484415">加载更多</span>，查看更多事件。</span>
      </li></ol>
    <section class="section result" id="v9156950__result_1">
      <div class="note note note_note"><span class="note__title">注意：</span> 当仅存在与进程相关的事件时，查看事件日志为空。</div>
      .</section>
  </div>
