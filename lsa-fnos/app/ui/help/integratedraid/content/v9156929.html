  <h1 class="title topictitle1" id="v9156929__v9156930">取消分配全局热备盘</h1>
  
  <div class="body taskbody" id="v9156929__v9156943">
    <section class="section context" id="v9156929__v9156944">
      <p class="p" id="v9156929__v9374223">执行以下步骤以取消分配热备盘。</p>
    </section>
    <ol class="ol steps" id="v9156929__v9156945"><li class="li step stepexpand" id="v9156929__v9374224">
        <span class="ph cmd" id="v9156929__v9374225">导航到控制器仪表板，然后单击 <span class="ph uicontrol" id="v9156929__v9374226">磁盘</span> 选项卡。</span>
        <div class="itemgroup stepresult" id="v9156929__v9374227">将显示所有关联的磁盘。</div>
      </li><li class="li step stepexpand" id="v9156929__v9374228">
        <span class="ph cmd" id="v9156929__v9374229">展开 <span class="ph uicontrol" id="v9156929__v9896736">热备盘</span>，然后选择要取消分配的热备盘。</span>
      </li><li class="li step stepexpand" id="v9156929__v9896856">
        <span class="ph cmd" id="v9156929__v9896857">选择 <span class="ph menucascade" id="v9156929__v9896858"><span class="ph uicontrol" id="v9156929__v9896859">操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9156929__v9896860">取消分配全局热备</span></span>。</span>
        <div class="itemgroup stepresult" id="v9156929__v9896861">已取消分配热备盘，该物理磁盘在 <span class="keyword wintitle" id="v9156929__v9896862">未配置的磁盘</span> 部分列为未配置的良好状态。</div>
      </li></ol>
  </div>
