  <h1 class="title topictitle1" id="v25013368__v10985167">检索 Snapdump 输出</h1>
  
  <div class="body refbody" id="v25013368__v10985131">
    <section class="section" id="v25013368__v10985132">
      <p class="p" id="v25013368__v25008094">LSI 存储管理软件可以选择从固件读取 Snapdump 日志。在某些情况下，固件可能保存多个 Snapdump 日志。 LSA 显示可用 Snapdump 日志的列表，其中包含文件 ID 和文件大小详细信息。</p>
      <p class="p" id="v25013368__v26588194">当 Snapdump 由固件或用户触发时，会生成 Snapdump 日志。当生成 Snapdump 日志时，用户可以选择下载哪个 Snapdump 日志。</p>
      <figure class="fig fignone" id="v25013368__v25013031"><figcaption><span class="fig--title-label">图 1. </span>下载Snapdump窗口</figcaption>
        
        <img class="image" id="v25013368__image_3" src="LSA8-Download-Snapdump-Log.png">
      </figure>
      <div class="note note note_note" id="v25013368__v25014024"><span class="note__title">注意：</span> 仅当启用 Snapdump 功能时，用户才能下载 Snapdump 日志。</div>
    </section>
  </div>
