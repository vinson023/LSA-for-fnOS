  <h1 class="title topictitle1" id="v9893951__v9893952">将磁盘设为未配置</h1>
  
  <div class="body taskbody" id="v9893951__v9893965">
    <section class="section context" id="v9893951__v9893966">
      <p class="p" id="v9893951__v9894007">执行以下步骤将 JBOD 磁盘的状态更改为“未配置”。</p>
    </section>
    <ol class="ol steps" id="v9893951__v9893967"><li class="li step stepexpand" id="v9893951__v9897779">
        <span class="ph cmd" id="v9893951__v9897780">导航到控制器仪表板，然后单击 <span class="ph uicontrol" id="v9893951__v9897781">磁盘</span> 选项卡。</span>
        <div class="itemgroup stepresult" id="v9893951__v9897782">将显示所有关联的磁盘。</div>
      </li><li class="li step stepexpand" id="v9893951__v9897783">
        <span class="ph cmd" id="v9893951__v9897784">展开 <span class="ph uicontrol" id="v9893951__v9897785">JBOD</span>，然后选择 JBOD 磁盘。</span>
      </li><li class="li step stepexpand" id="v9893951__v9897805">
        <span class="ph cmd" id="v9893951__v9897806">选择 <span class="ph menucascade" id="v9893951__v9897807"><span class="ph uicontrol" id="v9893951__v9897808">磁盘操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9893951__v9897809">取消配置</span></span>。</span>
        <div class="itemgroup stepresult">
          <p class="p">将显示一条确认消息。</p>
        </div>
      </li><li class="li step stepexpand" id="v9893951__step_1">
        <span class="ph cmd" id="v9893951__cmd_1">选中 <span class="ph uicontrol" id="v9893951__uicontrol_1">确认</span> 复选框，然后单击 <span class="ph uicontrol" id="v9893951__uicontrol_2">是，取消配置</span> 继续操作。</span>
        <div class="itemgroup stepresult" id="v9893951__stepresult_2">JBOD 磁盘更改为未配置的磁盘。</div>
      </li></ol>
  </div>
