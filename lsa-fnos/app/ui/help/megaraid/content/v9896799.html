  <h1 class="title topictitle1" id="v9896799__v9896800">移除磁盘</h1>
  
  <div class="body taskbody" id="v9896799__v9896813">
    <section class="section context" id="v9896799__v9896814">
      <p class="p" id="v9896799__v9896998">您可能需要卸下连接到控制器的未出现故障的磁盘。准备移除物理磁盘会使磁盘进入省电模式。</p>
    </section>
    <ol class="ol steps" id="v9896799__v9896999"><li class="li step stepexpand" id="v9896799__v9897000">
        <span class="ph cmd" id="v9896799__v9897001">导航到控制器仪表板，然后单击 <span class="ph uicontrol" id="v9896799__v9897002">磁盘</span> 选项卡。</span>
        <div class="itemgroup stepresult" id="v9896799__v9897003">将显示所有关联的磁盘。</div>
      </li><li class="li step stepexpand" id="v9896799__v9897004">
        <span class="ph cmd" id="v9896799__v9897005">展开 <span class="ph uicontrol" id="v9896799__v9897006">未配置的磁盘</span>，然后选择要移除的磁盘。</span>
      </li><li class="li step stepexpand" id="v9896799__v9897007">
        <span class="ph cmd" id="v9896799__v9897008">选择 <span class="ph menucascade" id="v9896799__v9897009"><span class="ph uicontrol" id="v9896799__v9897010">磁盘操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9896799__v9897011">准备移除</span></span>。</span>
        <div class="itemgroup stepresult" id="v9896799__v9897012">磁盘处于省电模式，可以拆卸。</div>
      </li><li class="li step stepexpand" id="v9896799__v9897018">
        <span class="ph cmd" id="v9896799__v9897019">等待磁盘完成停转，然后将其卸下。</span>
        <div class="itemgroup info" id="v9896799__v11484408">
          <p class="p" id="v9896799__v11484409">如果您不想移除磁盘，请选择 <span class="ph menucascade" id="v9896799__v11484410"><span class="ph uicontrol" id="v9896799__uicontrol_1">磁盘操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9896799__v11484412">撤销准备移除</span></span>。</p>
        </div>
      </li></ol>
  </div>
