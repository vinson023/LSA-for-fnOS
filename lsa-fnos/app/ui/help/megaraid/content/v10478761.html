  <h1 class="title topictitle1" id="v10478761__v10478762">查看磁盘组属性</h1>
  
  <div class="body refbody" id="v10478761__v10478775">
    <section class="section" id="v10478761__v10478776">
      <p class="p">在控制器仪表板中选择一个磁盘组以查看其属性。</p>
      <p class="p" id="v10478761__v10478777">下表描述<span class="ph">s</span> 磁盘组属性。</p>
      
      <table class="table frame-all table--pgwide-1" id="v10478761__table_3"><caption><span class="table--title-label">表 1. </span><span id="v10478761__title_3" class="title">磁盘组属性</span></caption><colgroup><col style="width:50%"><col style="width:50%"></colgroup><thead class="thead" id="v10478761__thead_3">
            <tr class="row rowsep-1" id="v10478761__row_10">
              <th class="entry colsep-1 rowsep-1" id="v10478761__entry_64">属性</th>
              <th class="entry colsep-1 rowsep-1" id="v10478761__entry_65">描述</th>
            </tr>
          </thead><tbody class="tbody" id="v10478761__tbody_3">
            <tr class="row">
              <td class="entry colsep-1 rowsep-1" headers="v10478761__entry_64 "><span class="ph uicontrol">数据保护</span></td>
              <td class="entry colsep-1 rowsep-1" headers="v10478761__entry_65 ">指示数据保护是启用还是禁用。</td>
            </tr>
            <tr class="row rowsep-1" id="v10478761__row_11">
              <td class="entry colsep-1 rowsep-1" id="v10478761__entry_71" headers="v10478761__entry_64 "><span class="ph uicontrol" id="v10478761__uicontrol_8">可用容量</span></td>
              <td class="entry colsep-1 rowsep-1" id="v10478761__entry_72" headers="v10478761__entry_65 ">指示磁盘组中的可用空间。</td>
            </tr>
            <tr class="row rowsep-1" id="v10478761__row_12">
              <td class="entry colsep-1 rowsep-1" id="v10478761__entry_78" headers="v10478761__entry_64 "><span class="ph uicontrol" id="v10478761__uicontrol_9">有担保</span></td>
              <td class="entry colsep-1 rowsep-1" id="v10478761__entry_79" headers="v10478761__entry_65 ">指示磁盘组是否受保护。</td>
            </tr>
            <tr class="row">
              <td class="entry colsep-1 rowsep-1" headers="v10478761__entry_64 "><span class="ph uicontrol">可用容量计数</span></td>
              <td class="entry colsep-1 rowsep-1" headers="v10478761__entry_65 ">显示磁盘组中的可用空闲块数量。 </td>
            </tr>
          </tbody></table>
      
      <p class="p" id="v10478761__p_1">如需对多个虚拟磁盘或多个物理磁盘执行启动一致性检查等操作，请单击 <img class="image" id="v10478761__image_3" height="12" src="LSA_expand_button_icon.png" width="14">（展开按钮），然后在 <span class="keyword wintitle" id="v10478761__wintitle_1">操作</span> 菜单中选择相应操作。</p>
    </section>
  </div>
