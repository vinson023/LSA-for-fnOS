  <h1 class="title topictitle1" id="v12239302__v12239303">升级和降级 IT 控制器上的固件 (VMware)</h1>
  
  <div class="body taskbody" id="v12239302__v12239316">
    <section class="section context" id="v12239302__v12239317">由于 VMware ESXi 6.7 和 VMware ESXi 7.0 存在一些问题，您无法按照通常的固件刷新程序通过 LSA 升级或降级 IT 固件。您必须遵循以下程序：</section>
    <ol class="ol steps" id="v12239302__v12239318"><li class="li step stepexpand" id="v12239302__v12239319">
        <span class="ph cmd" id="v12239302__v12239320">编辑 <span class="ph filepath" id="v12239302__v12239324">/etc/sfcb/sfcb.cfg</span> 文件。</span>
      </li><li class="li step stepexpand" id="v12239302__v12239325">
        <span class="ph cmd" id="v12239302__v12239326">添加 <span class="keyword parmname" id="v12239302__v12239327">http最大内容长度：4194304</span> 参数。</span>
      </li><li class="li step stepexpand" id="v12239302__v12239328">
        <span class="ph cmd" id="v12239302__v12239329">重新启动 LSA 服务：</span>
        <div class="itemgroup info" id="v12239302__v12842756"><span class="keyword cmdname" id="v12239302__v12842758">/etc/init.d/sfcbd-watchdog restart</span></div>
      </li><li class="li step stepexpand" id="v12239302__v12239331">
        <span class="ph cmd" id="v12239302__v12239332">刷新固件。</span>
      </li></ol>
  </div>
