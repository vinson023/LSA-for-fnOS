  <h1 class="title topictitle1" id="v9895647__v9895648">修改虚拟磁盘属性</h1>
  
  <div class="body taskbody" id="v9895647__v9895661">
    <section class="section context" id="v9895647__v9895662">
      <p class="p" id="v9895647__v9895876">创建虚拟磁盘后，您可以随时更改读取策略、写入策略和其他虚拟磁盘属性。执行以下步骤来修改虚拟磁盘设置。</p>
    </section>
    <ol class="ol steps" id="v9895647__v9895663"><li class="li step stepexpand" id="v9895647__v9895664">
        <span class="ph cmd" id="v9895647__v9896051">导航到控制器仪表板，然后单击磁盘组名称（例如，<span class="ph uicontrol" id="v9895647__v9896052">DG_1</span>）。</span>
        <div class="itemgroup info" id="v9895647__v24023501">单击 <img class="image" height="12" src="LSA_expand_button_icon.png" width="14"> 与磁盘组对应的图标以显示其内容。</div>
        <div class="itemgroup stepresult" id="v9895647__v9896054">将显示与所选磁盘组关联的虚拟磁盘和物理磁盘。</div>
      </li><li class="li step stepexpand" id="v9895647__v9895877">
        <span class="ph cmd" id="v9895647__v9895878">单击要更改其设置的虚拟磁盘。</span>
      </li><li class="li step stepexpand" id="v9895647__v9895879">
        <span class="ph cmd" id="v9895647__v9895880">选择 <span class="ph menucascade" id="v9895647__v9895881"><span class="ph uicontrol" id="v9895647__v9895882">操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9895647__v9895883">修改属性</span></span>。</span>
        <div class="itemgroup stepresult" id="v9895647__v9895884"><span class="keyword wintitle" id="v9895647__v9895885">修改虚拟磁盘属性</span> 对话框出现。
          
        </div>
      </li><li class="li step stepexpand" id="v9895647__v9895890">
        <span class="ph cmd" id="v9895647__v9895891">根据需要更改虚拟磁盘属性。</span>
        <div class="itemgroup info" id="v9895647__v24023504">有关这些属性的信息，请参阅 <a class="xref fm:ParaText" href="v8041820.html#v8041820">添加虚拟磁盘</a>。</div>
      </li><li class="li step stepexpand" id="v9895647__v9895937">
        <span class="ph cmd" id="v9895647__v9895938">单击 <span class="ph uicontrol" id="v9895647__v9895939">保存设置</span>。</span>
      </li></ol>
  </div>
