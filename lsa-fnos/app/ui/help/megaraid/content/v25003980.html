  <h1 class="title topictitle1" id="v25003980__v10985167">取消映射功能支持</h1>
  
  <div class="body refbody" id="v25003980__v10985131">
    <section class="section" id="v25003980__v10985132">
      <p class="p" id="v25003980__v25008094">使用 UNMAP 功能时，您可以执行以下操作。</p>
      <ul class="ul" id="v25003980__v25008095">
        <li class="li" id="v25003980__v25008096">在 SCSI 虚拟磁盘创建期间启用 UNMAP 功能。
          <figure class="fig fignone" id="v25003980__v25008097"><figcaption><span class="fig--title-label">图 1. </span>在创建虚拟磁盘期间启用 UNMAP 功能</figcaption>
            
            <br><div class="imageleft"><img class="image imageleft" height="294" src="LSA_Figure21-EnableTheUnmapFeatureDuringVolumeCreation.png" width="543"></div><br>
          </figure>
        </li>
        <li class="li" id="v25003980__v25008100">显示物理磁盘级别的 UNMAP 属性。
          <figure class="fig fignone" id="v25003980__v25008101"><figcaption><span class="fig--title-label">图 2. </span>磁盘级别取消映射属性窗口</figcaption>
            
            <br><div class="imageleft"><img class="image imageleft" height="302" src="LSA_Figure22-DriveLevelUnmapPropertiesWindow.png" width="516"></div><br>
          </figure>
        </li>
        <li class="li" id="v25003980__v25008104">让用户使用虚拟磁盘修改（启用/禁用）属性选项来修改虚拟磁盘的 UNMAP 功能。
          <figure class="fig fignone" id="v25003980__v25008105"><figcaption><span class="fig--title-label">图 3. </span>启用或禁用 SCSI UNMAP 功能</figcaption>
            
            <br><div class="imageleft"><img class="image imageleft" height="212" src="LSA_Figure23-EnableOrDisableTheScsiUnmapFeature.png" width="547"></div><br>
          </figure>
        </li>
      </ul>
    </section>
  </div>
