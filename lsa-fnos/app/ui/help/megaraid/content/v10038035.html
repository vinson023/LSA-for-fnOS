  <h1 class="title topictitle1" id="v10038035__v10038036">配置密钥保管库（重新托管过程）</h1>
  
  <div class="body taskbody" id="v10038035__v10038042">
    <section class="section context" id="v10038035__v10038043">
      <p class="p" id="v10038035__v10038044">重新托管是将高级软件功能从一个控制器转移到另一个控制器的过程。此功能是有条件的，仅当需要重新托管过程并且密钥保管库和不安全的密钥同时存在时才会出现。要实施重新托管过程，请执行以下步骤。</p>
    </section>
    <ol class="ol steps" id="v10038035__v10038047"><li class="li step stepexpand" id="v10038035__v10038048">
        <span class="ph cmd" id="v10038035__v10044970">在 <span class="keyword wintitle" id="v10038035__v10044971">高级功能</span> 窗口，单击 <span class="ph uicontrol" id="v10038035__v10044972">配置密钥保管库</span>。</span>
        <div class="itemgroup info" id="v10038035__v10038057">
          <p class="p" id="v10038035__v10038058">将显示以下窗口。</p>
          <figure class="fig fignone" id="v10038035__v10038060"><figcaption><span class="fig--title-label">图 1. </span>高级功能窗口 – 配置 Key Vault</figcaption>
            
            <br><div class="imageleft"><img class="image imageleft" src="LSA_premium_features_key_vault.png"></div><br>
          </figure>
        </div>
      </li><li class="li step stepexpand" id="v10038035__v10038063">
        <span class="ph cmd" id="v10038035__v10038064">选择 <span class="ph uicontrol" id="v10038035__v10038065">我确认我已完成外部站点的重新托管过程。</span>复选框。</span>
      </li><li class="li step stepexpand" id="v10038035__v10038066">
        <span class="ph cmd" id="v10038035__v10038067">单击 <span class="ph uicontrol" id="v10038035__v10038068">下一步</span>。</span>
        <div class="itemgroup info" id="v10038035__v11484379">
          <p class="p" id="v10038035__v11484380"><span class="ph uicontrol" id="v10038035__v11484381">下一步</span> 仅当您选中该复选框时，屏幕中的按钮才会启用。</p>
        </div>
        <div class="itemgroup stepresult" id="v10038035__v10038102">
          <p class="p" id="v10038035__v10038103">将显示 <span class="keyword wintitle" id="v10038035__v10038104">激活功能</span> 窗口。</p>
          <figure class="fig fignone" id="v10038035__v10038107"><figcaption><span class="fig--title-label">图 2. </span>激活功能窗口 - 配置 Key Vault 窗口</figcaption>
            
            <br><div class="imageleft"><img class="image imageleft" src="LSA_activate_features_key_vault.png"></div><br>
          </figure>
        </div>
      </li><li class="li step stepexpand" id="v10038035__v10038075">
        <span class="ph cmd" id="v10038035__v10038076">单击 <span class="ph uicontrol" id="v10038035__v10038077">完成</span>，并且高级软件选项被安全地保存在密钥保管库中。</span>
      </li></ol>
  </div>
