  <h1 class="title topictitle1" id="v9897674__v9897675">手动启动学习周期</h1>
  
  <div class="body taskbody" id="v9897674__v9897688">
    <section class="section context" id="v9897674__v9897689">
      <p class="p" id="v9897674__v9897757">执行以下步骤手动启动学习周期属性。</p>
    </section>
    <ol class="ol steps" id="v9897674__v9897690"><li class="li step stepexpand" id="v9897674__v9897758">
        <span class="ph cmd" id="v9897674__v9897759">导航到控制器仪表板，然后单击 <span class="ph uicontrol" id="v9897674__v9897760">其他硬件</span> 选项卡。</span>
        <div class="itemgroup stepresult" id="v9897674__v9897761">所有连接到控制器的相关硬件都会出现。</div>
      </li><li class="li step stepexpand" id="v9897674__v9897762">
        <span class="ph cmd" id="v9897674__v9897763">展开 <span class="ph uicontrol" id="v9897674__v9897764">阵列卡电池/超级电容</span>，然后选择 阵列卡电池/超级电容。</span>
      </li><li class="li step stepexpand" id="v9897674__v9897765">
        <span class="ph cmd" id="v9897674__v9897766">选择 <span class="ph menucascade" id="v9897674__v9897767"><span class="ph uicontrol" id="v9897674__v9897768">操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9897674__v9897769">启动手动学习周期</span></span>。</span>
        <div class="itemgroup stepresult" id="v9897674__v9897770">将显示一条确认消息。</div>
      </li><li class="li step stepexpand" id="v9897674__v9897771">
        <span class="ph cmd" id="v9897674__v9897772">选中 <span class="ph uicontrol" id="v9897674__v9897773">确认</span> 复选框，然后单击 <span class="ph uicontrol" id="v9897674__v9897774">是，开始手动学习周期</span> 继续操作。</span>
        <div class="itemgroup stepresult" id="v9897674__v9897775">学习周期操作开始。</div>
      </li></ol>
  </div>
