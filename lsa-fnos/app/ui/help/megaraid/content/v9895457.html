  <h1 class="title topictitle1" id="v9895457__v9895458">确保高级软件的安全</h1>
  
  <div class="body taskbody" id="v9895457__v10038013">
    <section class="section context" id="v9895457__v10038014">
      <p class="p" id="v9895457__v10038015">您可以将高级软件从控制器传输到密钥保管库。此功能是有条件的，仅当密钥保管库和不安全密钥存在时才会出现。</p>
      <p class="p" id="v9895457__v10038017">执行以下步骤以保护高级软件。</p>
    </section>
    <ol class="ol steps" id="v9895457__v10038018"><li class="li step stepexpand" id="v9895457__v10038082">
        <span class="ph cmd" id="v9895457__v10038083">在 <span class="keyword wintitle" id="v9895457__v10038140">高级软件选项</span> 窗口，单击 <span class="ph uicontrol" id="v9895457__v10038141">配置密钥保管库</span>。</span>
        <div class="itemgroup stepresult" id="v9895457__v10038142">将显示 <span class="keyword wintitle" id="v9895457__v10038143">激活功能</span> 窗口。
          
        </div>
      </li><li class="li step stepexpand" id="v9895457__v10038029">
        <span class="ph cmd" id="v9895457__v10038030">如果您想保护高级软件，请选择 <span class="ph uicontrol" id="v9895457__v10038031">您现在想保护这些高级软件选项吗？</span> 复选框。</span>
        <div class="itemgroup info" id="v9895457__v10038032">
          <p class="p" id="v9895457__v10038033">选中该复选框后，<span class="ph uicontrol" id="v9895457__v10038034">保存</span> 按钮已启用。这种情况意味着高级软件受到密钥保管库的保护。</p>
        </div>
      </li></ol>
  </div>
