  <h1 class="title topictitle1" id="v9895747__v9895748">在虚拟磁盘上启动一致性检查</h1>
  
  <div class="body taskbody" id="v9895747__v9895761">
    <section class="section context" id="v9895747__v9895762">执行以下步骤以启动虚拟磁盘上的一致性检查。有关一致性检查的更多信息，请参阅 <a class="xref fm:ParaText" href="v9894167.html#v9894167">运行一致性检查</a>。</section>
    <ol class="ol steps" id="v9895747__v9895763"><li class="li step stepexpand" id="v9895747__v9895764">
        <span class="ph cmd" id="v9895747__v9896046">导航到控制器仪表板，选择磁盘组名称（例如，<span class="ph uicontrol" id="v9895747__v9896047">DG_1</span>）。</span>
        <div class="itemgroup info" id="v9895747__v9896049">单击 <img class="image" id="v9895747__image_1" height="12" src="LSA_expand_button_icon.png" width="14"> 与磁盘组对应的图标以显示其内容。</div>
        <div class="itemgroup stepresult">将显示与所选磁盘组关联的虚拟磁盘和物理磁盘。</div>
      </li><li class="li step stepexpand" id="v9895747__v9896029">
        <span class="ph cmd" id="v9895747__v9896050">单击要启动一致性检查的虚拟磁盘。</span>
      </li><li class="li step stepexpand" id="v9895747__v9896031">
        <span class="ph cmd" id="v9895747__v9896032">选择 <span class="ph menucascade" id="v9895747__v9896033"><span class="ph uicontrol" id="v9895747__v9896034">操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9895747__v9896035">开始一致性检查</span></span>。</span>
        <div class="itemgroup stepresult" id="v9895747__v9896036">一致性检查操作开始。您可以在 <span class="keyword wintitle" id="v9895747__v9896039">后台进程正在进行中</span> 部分查看此操作的进度。一致性检查操作开始后，<span class="ph uicontrol" id="v9895747__v9896038">操作</span> 菜单中的 <span class="ph uicontrol" id="v9895747__v9896037">停止一致性检查</span> 选项将启用。</div>
      </li></ol>
  </div>
