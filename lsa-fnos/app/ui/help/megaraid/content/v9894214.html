  <h1 class="title topictitle1" id="v9894214__v9894215">运行巡检读取</h1>
  
  <div class="body conbody" id="v9894214__v9894228">
    <p class="p" id="v9894214__v9895339">巡检读取会定期验证连接到控制器的磁盘的所有扇区，包括 RAID 配置的磁盘中的系统保留区域。您可以对所有 RAID 级别和所有热备盘运行巡检读取。仅当控制器空闲一段定义的时间并且没有其他后台活动时才会启动巡检读取。您可以设置巡检读取属性并启动巡检读取操作，也可以在不更改属性的情况下启动巡检读取。</p>
  </div>
