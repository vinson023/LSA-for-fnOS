  <h1 class="title topictitle1" id="ariaid-title1">格式化 NVMe 磁盘</h1>
  <div class="body taskbody">
    <section class="section context">
      <p class="p"></p>
    </section>
    <ol class="ol steps"><li class="li step stepexpand" id="_2d17a1fb-d0a7-4777-a828-9514dd469153__v9896979">
        <span class="ph cmd" id="_2d17a1fb-d0a7-4777-a828-9514dd469153__v9896980">导航到控制器仪表板，然后单击 <span class="ph uicontrol" id="_2d17a1fb-d0a7-4777-a828-9514dd469153__v9896981">磁盘</span> 选项卡。</span>
        <div class="itemgroup stepresult" id="_2d17a1fb-d0a7-4777-a828-9514dd469153__v9896982">将显示关联的磁盘。</div>
      </li><li class="li step stepexpand" id="_2d17a1fb-d0a7-4777-a828-9514dd469153__v9896983">
        <span class="ph cmd" id="_2d17a1fb-d0a7-4777-a828-9514dd469153__v9896984">展开 <span class="ph uicontrol" id="_2d17a1fb-d0a7-4777-a828-9514dd469153__v9896985">未配置的磁盘</span>，然后选择要重新配置的磁盘。</span>
        <div class="itemgroup info">
          <figure class="fig fignone" id="_2d17a1fb-d0a7-4777-a828-9514dd469153__fig_2">
            <img class="image" height="181" src="LSA_NVMe_Start_Reconfigure.png" width="650">
          </figure>
        </div>
      </li><li class="li step stepexpand" id="_2d17a1fb-d0a7-4777-a828-9514dd469153__v9896986">
        <span class="ph cmd" id="_2d17a1fb-d0a7-4777-a828-9514dd469153__v9896987">选择 <span class="ph menucascade" id="_2d17a1fb-d0a7-4777-a828-9514dd469153__v9896988"><span class="ph uicontrol" id="_2d17a1fb-d0a7-4777-a828-9514dd469153__v9896933">磁盘操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="_2d17a1fb-d0a7-4777-a828-9514dd469153__v9896990">开始重新配置</span></span>。</span>
      </li><li class="li step stepexpand">
        <span class="ph cmd">在 <span class="keyword wintitle">重新配置</span> 对话框中更新字段值。</span>
      </li><li class="li step stepexpand">
        <span class="ph cmd">单击 <span class="ph uicontrol">重新配置</span>。</span>
        <div class="itemgroup info">
          <div class="note note note_note" id="_2d17a1fb-d0a7-4777-a828-9514dd469153__note_1"><span class="note__title">注意：</span> 仅当用户更改任一值后，<span class="ph uicontrol">重新配置</span> 按钮才会启用。</div>
        </div>
      </li></ol>
  </div>
