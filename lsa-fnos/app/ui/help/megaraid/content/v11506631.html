  <h1 class="title topictitle1" id="v11506631__v11506632">取消隐藏磁盘组</h1>
  
  
  <div class="body taskbody" id="v11506631__v11506644"><p class="shortdesc">您可以在控制器上取消隐藏磁盘组。</p>
    <section class="section context" id="v11506631__v11506645">
      <p class="p" id="v11506631__v11506646">如果取消隐藏某个磁盘组，属于该磁盘组的所有虚拟磁盘都会取消隐藏。</p>
      <div class="note note note_note"><span class="note__title">注意：</span> SAS4xxx 控制器不支持取消隐藏磁盘组。</div>
      <p class="p" id="v11506631__v11506647">执行以下步骤取消隐藏磁盘组：</p>
    </section>
    <ol class="ol steps" id="v11506631__v11506648"><li class="li step stepexpand" id="v11506631__v11506711">
        <span class="ph cmd" id="v11506631__v11506712">导航到控制器仪表板，然后单击 <span class="keyword wintitle" id="v11506631__v11506713">磁盘组</span> （例如，<span class="ph uicontrol" id="v11506631__v11506714">DG_1</span>）。</span>
      </li><li class="li step stepexpand" id="v11506631__v11506715">
        <span class="ph cmd" id="v11506631__v11506716">单击要取消隐藏的磁盘组。</span>
      </li><li class="li step stepexpand" id="v11506631__v11506717">
        <span class="ph cmd" id="v11506631__v11506718">导航至 <span class="ph menucascade" id="v11506631__v11506719"><span class="ph uicontrol" id="v11506631__v11506720">操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v11506631__v11506721">取消隐藏所有虚拟磁盘</span></span>。</span>
        <div class="itemgroup info" id="v11506631__v11506722">
          <p class="p" id="v11506631__v11506723">出现一个消息框，要求您确认操作。</p>
        </div>
      </li><li class="li step stepexpand" id="v11506631__v11506659">
        <span class="ph cmd" id="v11506631__v11506660">选择 <span class="ph uicontrol" id="v11506631__v11506661">确认</span> 复选框并单击 <span class="ph uicontrol" id="v11506631__v11506662">是</span> 取消隐藏磁盘组。</span>
      </li></ol>
  </div>
