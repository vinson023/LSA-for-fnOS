  <h1 class="title topictitle1" id="v10044973__v10044974">实施重新托管流程</h1>
  
  <div class="body taskbody" id="v10044973__v10044980">
    <section class="section context" id="v10044973__v10044981">
      <p class="p" id="v10044973__v10044982">如果您想要将高级软件选项从一个控制器转移到另一个控制器，请使用重新托管过程。重新托管过程可确保这些选项在密钥保管库中受到保护。您必须配置密钥保管库才能完成重新托管过程。要实施重新托管过程，请执行以下步骤。</p>
    </section>
    <ol class="ol steps" id="v10044973__v10044984"><li class="li step stepexpand" id="v10044973__v10044985">
        <span class="ph cmd" id="v10044973__v10044986">在 <span class="keyword wintitle" id="v10044973__v10044987">高级功能</span> 窗口，单击 <span class="ph uicontrol" id="v10044973__v10044988">配置密钥保管库</span>。</span>
        <div class="itemgroup info" id="v10044973__v10044989">
          <p class="p" id="v10044973__v10044990">将显示以下窗口。</p>
          <figure class="fig fignone" id="v10044973__v10044991"><figcaption><span class="fig--title-label">图 1. </span>高级功能窗口 – 重新托管完成</figcaption>
            
            <br><div class="imageleft"><img class="image imageleft" src="LSA_premium_features_rehosting_complete.png"></div><br>
          </figure>
        </div>
      </li><li class="li step stepexpand" id="v10044973__v10044994">
        <span class="ph cmd" id="v10044973__v10044995">选择 <span class="ph uicontrol" id="v10044973__v10044996">我确认我已完成外部站点的重新托管过程。</span>复选框。</span>
        <div class="itemgroup stepresult" id="v10044973__v10045013">此设置可确保将高级软件功能传输到控制器。</div>
      </li><li class="li step stepexpand" id="v10044973__v10045008">
        <span class="ph cmd" id="v10044973__v10045009">单击 <span class="ph uicontrol" id="v10044973__v10045010">完成</span>，并且高级软件选项已安全地保存在密钥保管库中，或者单击 <span class="ph uicontrol" id="v10044973__v12844985">取消</span> 如果您不想激活重新托管过程</span>
      </li></ol>
  </div>
