  <h1 class="title topictitle1" id="v9896667__v9896668">启动和停止定位磁盘</h1>
  
  <div class="body taskbody" id="v9896667__v9896681">
    <section class="section context" id="v9896667__v9896682">
      <p class="p" id="v9896667__v9896831">如果物理磁盘位于磁盘柜中，您可以通过使其 LED 闪烁来识别它们。</p>
      <p class="p" id="v9896667__v12834878">执行以下步骤来识别物理磁盘。</p>
    </section>
    <ol class="ol steps" id="v9896667__v9896683"><li class="li step stepexpand" id="v9896667__v9896684">
        <span class="ph cmd" id="v9896667__v9896832">在控制器仪表板中导航至物理磁盘，然后选择要识别的物理磁盘，例如未配置的良好物理磁盘、联机物理磁盘或已配置物理磁盘。</span>
      </li><li class="li step stepexpand" id="v9896667__v9896838">
        <span class="ph cmd" id="v9896667__v9896839">选择 <span class="ph menucascade" id="v9896667__v9896840"><span class="ph uicontrol" id="v9896667__v9896877">磁盘操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9896667__v9896842">开始定位</span></span>。</span>
        <div class="itemgroup stepresult" id="v9896667__v9896843">物理磁盘上相应的 LED 开始闪烁。</div>
      </li><li class="li step stepexpand" id="v9896667__v9896844">
        <span class="ph cmd" id="v9896667__v9896845">选择 <span class="ph menucascade" id="v9896667__v9896846"><span class="ph uicontrol" id="v9896667__uicontrol_1">磁盘操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9896667__v9896848">停止定位</span></span>，停止 LED 闪烁。</span>
      </li></ol>
  </div>
