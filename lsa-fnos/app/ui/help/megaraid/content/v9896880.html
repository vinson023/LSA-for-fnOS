  <h1 class="title topictitle1" id="v9896880__v9896881">使磁盘联机</h1>
  
  <div class="body taskbody" id="v9896880__v9896894">
    <section class="section context" id="v9896880__v9896895">
      <p class="p" id="v9896880__v9896903">您可以将物理磁盘的状态更改为联机。在联机状态下，物理磁盘正常工作并且是配置的虚拟磁盘的一部分。</p>
    </section>
    <ol class="ol steps" id="v9896880__v9896904"><li class="li step stepexpand" id="v9896880__v9896905">
        <span class="ph cmd" id="v9896880__v9896906">导航到控制器仪表板，然后单击磁盘组名称（例如，<span class="ph uicontrol" id="v9896880__v9896907">DG_1</span>）。</span>
        <div class="itemgroup info">单击 <img class="image" id="v9896880__image_1" height="12" src="LSA_expand_button_icon.png" width="14"> 与磁盘组对应的图标以显示其内容。</div>
        <div class="itemgroup stepresult" id="v9896880__v9896909">将显示与所选磁盘组关联的虚拟磁盘和物理磁盘。</div>
      </li><li class="li step stepexpand" id="v9896880__v9896910">
        <span class="ph cmd" id="v9896880__v9896911">单击 <span class="ph uicontrol" id="v9896880__v9896912">物理磁盘</span> 选项卡，然后选择要联机的脱机磁盘。</span>
      </li><li class="li step stepexpand" id="v9896880__v9896913">
        <span class="ph cmd" id="v9896880__v9896914">选择 <span class="ph menucascade" id="v9896880__v9896915"><span class="ph uicontrol" id="v9896880__v9896877">磁盘操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9896880__v9896917">使磁盘联机</span></span>。</span>
        <div class="itemgroup stepresult" id="v9896880__v9896918">磁盘状态更改为“联机”。</div>
      </li></ol>
  </div>
