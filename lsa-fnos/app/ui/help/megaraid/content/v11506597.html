  <h1 class="title topictitle1" id="v11506597__v11506598">隐藏磁盘组</h1>
  
  
  <div class="body taskbody" id="v11506597__v11506610"><p class="shortdesc">您可以隐藏控制器上的磁盘组。 </p>
    <section class="section context" id="v11506597__v11506611">
      <p class="p" id="v11506597__v11506612">如果隐藏磁盘组，属于该磁盘组的所有虚拟磁盘都会被隐藏。</p>
      <div class="note note note_note"><span class="note__title">注意：</span> SAS4xxx 控制器不支持隐藏磁盘组。</div>
      <p class="p" id="v11506597__v11506613">执行以下步骤隐藏磁盘组：</p>
    </section>
    <ol class="ol steps" id="v11506597__v11506614"><li class="li step stepexpand" id="v11506597__v11506698">
        <span class="ph cmd" id="v11506597__v11506699">导航到控制器仪表板，然后单击 <span class="keyword wintitle" id="v11506597__v11506700">磁盘组</span> （例如，<span class="ph uicontrol" id="v11506597__v11506701">DG_1</span>）。</span>
      </li><li class="li step stepexpand" id="v11506597__v11506618">
        <span class="ph cmd" id="v11506597__v11506619">单击要隐藏的磁盘组。</span>
      </li><li class="li step stepexpand" id="v11506597__v11506625">
        <span class="ph cmd" id="v11506597__v11506626">导航至 <span class="ph menucascade" id="v11506597__v11506702"><span class="ph uicontrol" id="v11506597__v11506703">操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v11506597__v11506704">隐藏所有虚拟磁盘</span></span>。</span>
        <div class="itemgroup info" id="v11506597__v11506705">
          <p class="p" id="v11506597__v11506706">出现一个消息框，要求您确认操作。</p>
        </div>
      </li><li class="li step stepexpand" id="v11506597__v11506707">
        <span class="ph cmd" id="v11506597__v11506708">选择 <span class="ph uicontrol" id="v11506597__v11506709">确认</span> 复选框并单击 <span class="ph uicontrol" id="v11506597__v11506710">是</span> 隐藏磁盘组。</span>
      </li></ol>
  </div>
