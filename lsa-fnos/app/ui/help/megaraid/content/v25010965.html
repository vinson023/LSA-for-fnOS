  <h1 class="title topictitle1" id="v25010965__v11483349">Snapdump 功能</h1>
  
  <div class="body conbody" id="v25010965__v11483362">
    <p class="p" id="v25010965__v11483363">Snapdump 功能是一种在故障时保存调试信息快照的方法。目的是收集所有必需的信息，以便能够在第一次缺陷检测时找到缺陷的根本原因。这确保了调试时不需要多个缺陷再现。</p>
    <p class="p">本节介绍如何使用 LSA 获取和设置 Snapdump 属性，以及如何从固件下载相应的转储文件。</p>
  </div>
