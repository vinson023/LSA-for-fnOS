  <h1 class="title topictitle1" id="v12290774__v12290775">VMware 操作系统上的注销和重新启动要求</h1>
  
  <div class="body refbody" id="v12290774__v12290788">
    <section class="section" id="v12290774__v12290789">某些特性和功能（例如刷新固件、控制器模式管理、配置文件管理、管理 SAS 存储链路速率和管理 PCIe 通道速率）可能需要重新启动服务器才能使更改生效。
      <p class="p" id="v12290774__v12290790">对于前面提到的功能，您必须遵循以下说明：</p>
      <ol class="ol" id="v12290774__v12842746">
        <li class="li" id="v12290774__v12842747">从 LSA 客户端注销。</li>
        <li class="li" id="v12290774__v12842749">重新启动 VMware 服务器。</li>
        <li class="li" id="v12290774__v12842751">VMware 服务器启动后，再次登录以检查更改是否已生效。</li>
      </ol>
      <div class="note note note_note" id="v12290774__v12290798"><span class="note__title">注意：</span> 
        <p class="p" id="v12290774__v12290799">如果前面提到的某些功能需要注销和重新启动，您将收到以下消息通知：<code class="ph codeph" id="v12290774__v12290800">重新启动完成后，请注销并重新登录服务器。</code></p>
      </div>
    </section>
  </div>
