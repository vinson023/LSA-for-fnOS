  <h1 class="title topictitle1" id="ariaid-title1">管理 SID 所有权</h1>
  
  <div class="body refbody">
    <section class="section">
      
      <p class="p">管理 SID 所有权功能允许您将 SED 磁盘的 SID 凭据设置为由 MSID 或固件管理。要管理 SID 所有权，请导航至 <span class="ph menucascade"><span class="ph uicontrol">更多操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol">管理 SID 所有权</span></span>。</p>
      <figure class="fig fignone" id="GUID-59224e66-89b7-410d-aee3-2d83544a7fe6__fig_4"><figcaption><span class="fig--title-label">图 1. </span>管理 SID 所有权</figcaption>
        
        <img class="image" src="lsa-manage-sid-ownership.png">
      </figure>
      <p class="p"><span class="keyword wintitle">管理 SID 所有权</span> 对话框包含两个表格。<span class="keyword wintitle">磁盘安全默认值</span> 表格显示由 MSID 默认拥有的物理磁盘信息。<span class="keyword wintitle">磁盘安全固件管理</span> 表格显示由固件拥有的物理磁盘信息。当所有物理磁盘均由 MSID 拥有时，物理磁盘数量会显示在表格名称旁。</p>
      <div class="note note note_note" id="GUID-59224e66-89b7-410d-aee3-2d83544a7fe6__note_1"><span class="note__title">注意：</span> MSID/默认物理磁盘仅包括受保护的 JBOD 磁盘。固件拥有的物理磁盘同样是受保护的 JBOD 磁盘，但其所有权归固件。</div>
    </section>
  </div>
