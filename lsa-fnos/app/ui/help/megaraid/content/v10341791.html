  <h1 class="title topictitle1" id="v10341791__v10341792">清除具有 CacheCade 虚拟磁盘的控制器上的配置</h1>
  
  <div class="body taskbody" id="v10341791__v10341805">
    <section class="section context" id="v10341791__v10341806">
      <p class="p" id="v10341791__v10342065">您可以清除具有 CacheCade Pro 2.0 虚拟磁盘的选定控制器上的所有现有配置。</p>
    </section>
    <ol class="ol steps" id="v10341791__v10342066"><li class="li step stepexpand" id="v10341791__v10342067">
        <span class="ph cmd" id="v10341791__v10342068">导航到您要清除其配置的控制器仪表板。</span>
      </li><li class="li step stepexpand" id="v10341791__v10342069">
        <span class="ph cmd" id="v10341791__v10342070">单击 <span class="ph uicontrol" id="v10341791__v10342071">配置</span>，然后单击 <span class="ph uicontrol" id="v10341791__v10342072">清除配置</span>。</span>
        <div class="itemgroup stepresult" id="v10341791__v10342073">将显示以下确认消息。
          <figure class="fig fignone" id="v10341791__v10342074"><figcaption><span class="fig--title-label">图 1. </span>清除配置 – CacheCade – SSD 缓存</figcaption>
            
            <br><div class="imageleft"><img class="image imageleft" src="LSA_cc_clear_config.png"></div><br>
          </figure>
        </div>
      </li><li class="li step stepexpand" id="v10341791__v10342077">
        <span class="ph cmd" id="v10341791__v10342078">选择 <span class="ph uicontrol" id="v10341791__v10342079">确认</span> 复选框并单击 <span class="ph uicontrol" id="v10341791__v10342080">是，清除配置</span> 清除控制器上的所有现有配置。</span>
        <div class="itemgroup info" id="v10341791__v11484392">
          <p class="p" id="v10341791__v11484393">但是，无法清除操作系统磁盘。</p>
        </div>
      </li></ol>
  </div>
