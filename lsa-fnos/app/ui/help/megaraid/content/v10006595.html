  <h1 class="title topictitle1" id="v10006595__v10006596">从配置中移除磁盘</h1>
  
  <div class="body taskbody" id="v10006595__v10006609">
    <section class="section context" id="v10006595__v10006610">例如，如果您将磁盘组的 RAID 级别从 RAID 5 迁移到 RAID 0，则 <span class="keyword wintitle" id="v10006595__v10006611">修改磁盘组</span> 向导允许您从现有配置中移除物理磁盘以启用 RAID 级别迁移。</section>
    <ol class="ol steps" id="v10006595__v10006612"><li class="li step stepexpand" id="v10006595__v10006622">
        <span class="ph cmd" id="v10006595__v10006623">在 <span class="keyword wintitle" id="v10006595__v10037972">修改磁盘组</span> 窗口中，选择 <span class="ph uicontrol" id="v10006595__v10006624">移除磁盘</span>，然后单击 <span class="ph uicontrol" id="v10006595__v10006625">下一步</span>。</span>
        <div class="itemgroup stepresult" id="v10006595__v10029590">将显示 <span class="keyword wintitle" id="v10006595__v10029591">修改磁盘组</span> 窗口，其中列出将 RAID 级别从当前级别更改为新 RAID 级别所需移除的物理磁盘数量，以及可移除的物理磁盘最大数量。</div>
      </li><li class="li step stepexpand" id="v10006595__v10006626">
        <span class="ph cmd" id="v10006595__v10006627">单击 <img class="image" height="17" src="LSA_modify_DG_remove_physical_drives_icon.png" width="10"> 图标以移除磁盘。</span>
      </li><li class="li step stepexpand" id="v10006595__v10006628">
        <span class="ph cmd" id="v10006595__v10006629">单击 <span class="ph uicontrol" id="v10006595__v10006630">完成</span>。</span>
        <div class="itemgroup stepresult" id="v10006595__v10029596">RAID 级别已迁移。将显示一条确认消息。您可以监控重建的进度。请参阅 <a class="xref fm:ParaText" href="v9895285.html#v9895285" title="本节介绍 LSI 存储管理软件支持的后台操作。">后台操作支持</a>。</div>
      </li></ol>
  </div>
