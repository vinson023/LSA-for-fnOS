  <h1 class="title topictitle1" id="v10006413__v10006414">在不添加或移除磁盘的情况下迁移 RAID 级别</h1>
  
  <div class="body taskbody" id="v10006413__v10006427">
    <section class="section context" id="v10006413__v10006482">例如，如果您将磁盘组的 RAID 级别从 RAID 5 迁移到 RAID 0，则 <span class="keyword wintitle" id="v10006413__v10006483">修改磁盘组</span> 向导允许您迁移 RAID 级别，而无需添加或移除磁盘。</section>
    <ol class="ol steps" id="v10006413__v10006429"><li class="li step stepexpand" id="v10006413__v10006584">
        <span class="ph cmd" id="v10006413__v10006585">在 <span class="keyword wintitle" id="v10006413__v10037973">修改磁盘组</span> 窗口中，选择 <span class="ph uicontrol" id="v10006413__v10006586">迁移 RAID 级别</span>。</span>
      </li><li class="li step stepexpand">
        <span class="ph cmd">单击 <span class="ph uicontrol" id="v10006413__v10006587">下一步</span>。</span>
        <div class="itemgroup stepresult" id="v10006413__v10029603">RAID 级别已迁移。将显示一条确认消息。您可以监控重建进度。请参阅 <a class="xref fm:ParaText" href="v9895285.html#v9895285" title="本节介绍 LSI 存储管理软件支持的后台操作。">后台操作支持</a>。</div>
      </li></ol>
  </div>
