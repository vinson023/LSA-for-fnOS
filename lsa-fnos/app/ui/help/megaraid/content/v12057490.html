  <h1 class="title topictitle1" id="v12057490__v12057491">配置文件管理</h1>
  
  <div class="body conbody" id="v12057490__v12057504">
    <p class="p" id="v12057490__v12057505">配置文件管理允许您为每种控制器模式支持多种配置。配置文件用于自定义控制器，以便为该配置提供最佳性能。例如，不支持 PCI 设备的配置文件可以比支持 32 个 PCI 设备的配置文件支持更高的队列深度。</p>
