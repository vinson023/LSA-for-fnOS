  <h1 class="title topictitle1" id="v11480043__v11480044">更改控制器模式</h1>
  
  <div class="body taskbody" id="v11480043__v11480057">
    <section class="section context" id="v11480043__v11480058">
      <p class="p" id="v11480043__v11480071">执行以下步骤可在不同控制器模式之间切换。目前，您可以在 RAID 和 JBOD 控制器模式之间切换。</p>
    </section>
    <ol class="ol steps" id="v11480043__v11480059"><li class="li step stepexpand" id="v11480043__v11480060">
        <span class="ph cmd" id="v11480043__v11480061">在控制器仪表板上，选择 <span class="ph menucascade" id="v11480043__v11482566"><span class="ph uicontrol" id="v11480043__v11482567">操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v11480043__v11482568">控制器模式管理</span></span>。</span>
        <div class="itemgroup info" id="v11480043__v11480072">
          <p class="p" id="v11480043__v11480073">将显示 <strong class="ph b">更改控制器模式</strong> 页面。</p>
          
        </div>
      </li><li class="li step stepexpand" id="v11480043__v11480074">
        <span class="ph cmd" id="v11480043__v11480075">从 <strong class="ph b">选择控制器模式</strong> 下拉列表中选择所需的控制器模式，然后单击 <strong class="ph b">更改</strong>。</span>
      </li><li class="li step stepexpand" id="v11480043__v11721420">
        <span class="ph cmd" id="v11480043__v11721421">重新启动系统以使更改生效。</span>
      </li></ol>
  </div>
