  <h1 class="title topictitle1" id="ariaid-title1">停转</h1>
  
  <div class="body taskbody">
    <section class="section context">
      <p class="p">LSA 允许控制器操作在关闭操作期间设置磁盘转速降低。</p>
    </section>
    <ol class="ol steps"><li class="li step stepexpand" id="_eb9a24ea-c3ec-4670-82b2-a02fa19e258e__v9894142">
        <span class="ph cmd" id="_eb9a24ea-c3ec-4670-82b2-a02fa19e258e__v9895959">在控制器仪表板中，选择 <span class="ph menucascade" id="_eb9a24ea-c3ec-4670-82b2-a02fa19e258e__v9895960"><span class="ph uicontrol" id="_eb9a24ea-c3ec-4670-82b2-a02fa19e258e__v9895961">更多操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="_eb9a24ea-c3ec-4670-82b2-a02fa19e258e__v9895962">关机时使磁盘停转</span></span>。</span>
      </li><li class="li step stepexpand">
        <span class="ph cmd">选择 <span class="ph uicontrol">磁盘类型</span> 在关机时降速。</span>
        <div class="itemgroup info"><img class="image" height="260" src="lsa-spin-down.png" width="550"></div>
      </li><li class="li step stepexpand">
        <span class="ph cmd">单击 <span class="ph uicontrol">保存</span>。</span>
      </li></ol>
