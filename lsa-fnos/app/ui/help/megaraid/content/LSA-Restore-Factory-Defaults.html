  <h1 class="title topictitle1" id="ariaid-title1">管理出厂默认设置</h1>
  
  <div class="body taskbody">
    <section class="section context">
      <p class="p">LSI 存储管理软件可显示已修改的出厂值，并提供将其恢复为默认出厂设置的选项。</p>
      <p class="p">执行以下步骤恢复出厂默认设置。</p>
    </section>
    <ol class="ol steps"><li class="li step stepexpand" id="task.dita_2462bdc0-33cd-4e4d-b667-f76eac088b54__v8144008">
        <span class="ph cmd" id="task.dita_2462bdc0-33cd-4e4d-b667-f76eac088b54__v8144009">导航到控制器仪表板。</span>
      </li><li class="li step stepexpand">
        <span class="ph cmd">选择 <span class="ph menucascade"><span class="ph uicontrol">磁盘操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol">出厂默认设置</span></span>。</span>
        <div class="itemgroup stepresult">将显示 <span class="keyword wintitle">出厂默认设置</span> 窗口。<span class="keyword wintitle" id="task.dita_2462bdc0-33cd-4e4d-b667-f76eac088b54__wintitle_3">出厂默认设置</span> 窗口显示修改后的出厂默认属性。
          <figure class="fig fignone" id="task.dita_2462bdc0-33cd-4e4d-b667-f76eac088b54__fig_5"><figcaption><span class="fig--title-label">图 1. </span>出厂默认设置</figcaption>
            
            <img class="image" id="task.dita_2462bdc0-33cd-4e4d-b667-f76eac088b54__image_7" height="267" src="LSA-Factory-Defaults.png" width="650">
          </figure>
        </div>
      </li><li class="li step stepexpand">
        <span class="ph cmd">（可选）单击 <span class="ph uicontrol">查看全部</span> 查看默认值。  </span>
      </li><li class="li step stepexpand">
        <span class="ph cmd">单击 <span class="ph uicontrol">恢复出厂默认设置</span> 将任何修改的设置恢复为默认出厂设置。</span>
      </li></ol>
  </div>
