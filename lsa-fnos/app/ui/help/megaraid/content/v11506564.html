  <h1 class="title topictitle1" id="v11506564__v11506565">取消隐藏虚拟磁盘</h1>
  
  
  <div class="body taskbody" id="v11506564__v11506577"><p class="shortdesc">您可以取消隐藏控制器上的虚拟磁盘。</p>
    <section class="section context" id="v11506564__v11506578">
      <div class="note note note_note"><span class="note__title">注意：</span> SAS4xxx 控制器不支持取消隐藏虚拟磁盘。</div>
      <p class="p" id="v11506564__v11506580">执行以下步骤取消隐藏虚拟磁盘：</p>
    </section>
    <ol class="ol steps" id="v11506564__v11506581"><li class="li step stepexpand" id="v11506564__v11506677">
        <span class="ph cmd" id="v11506564__v11506678">导航到控制器仪表板，然后单击 <span class="keyword wintitle" id="v11506564__v11506679">磁盘组</span> （例如，<span class="ph uicontrol" id="v11506564__v11506680">DG_1</span>）。</span>
      </li><li class="li step stepexpand" id="v11506564__v11506584">
        <span class="ph cmd" id="v11506564__v11506585">选择要取消隐藏的整个虚拟磁盘组。</span>
      </li><li class="li step stepexpand" id="v11506564__v11506685">
        <span class="ph cmd" id="v11506564__v11506686">选择 <span class="ph menucascade" id="v11506564__v11506687"><span class="ph uicontrol" id="v11506564__v11506688">操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v11506564__v11506690">取消隐藏</span></span>。</span>
        <div class="itemgroup info" id="v11506564__v11506691">
          <p class="p" id="v11506564__v11506692">出现一个消息框，要求您确认操作。</p>
        </div>
      </li><li class="li step stepexpand" id="v11506564__v11506586">
        <span class="ph cmd" id="v11506564__v11506587">单击 <span class="keyword wintitle" id="v11506564__v11506697">是</span>取消隐藏虚拟磁盘。</span>
      </li></ol>
  </div>
