  <h1 class="title topictitle1" id="v11506515__v11506516">隐藏和取消隐藏虚拟磁盘或磁盘组</h1>
  
  
  <div class="body conbody" id="v11506515__v11506528"><p class="shortdesc">您可以隐藏或取消隐藏控制器上的虚拟磁盘或磁盘组。</p>
    <div class="note note note_note"><span class="note__title">注意：</span> SAS4xxx 控制器不支持隐藏和取消隐藏虚拟磁盘或磁盘组。</div>
    
  </div>
