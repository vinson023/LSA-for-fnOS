  <h1 class="title topictitle1" id="v9893974__v9893975">将磁盘设为 JBOD</h1>
  
  <div class="body taskbody" id="v9893974__v9893988">
    <section class="section context" id="v9893974__v9893989">
      <p class="p" id="v9893974__v9894008">执行以下步骤，将未配置的良好物理磁盘的状态更改为 JBOD。</p>
    </section>
    <ol class="ol steps" id="v9893974__v9897797"><li class="li step stepexpand" id="v9893974__v9897798">
        <span class="ph cmd" id="v9893974__v9897799">导航到控制器仪表板，然后单击 <span class="ph uicontrol" id="v9893974__v9897800">磁盘</span> 选项卡。</span>
        <div class="itemgroup stepresult" id="v9893974__v9897801">将显示所有关联的磁盘。</div>
      </li><li class="li step stepexpand" id="v9893974__v9897802">
        <span class="ph cmd" id="v9893974__v9897803">展开 <span class="ph uicontrol" id="v9893974__v9897804">未配置的磁盘</span>，然后选择一个未配置的良好物理磁盘。</span>
      </li><li class="li step stepexpand" id="v9893974__v9897805">
        <span class="ph cmd" id="v9893974__v9897806">选择 <span class="ph menucascade" id="v9893974__v9897807"><span class="ph uicontrol" id="v9893974__v9897808">磁盘操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9893974__v9897809">将磁盘设为 JBOD</span></span>。</span>
        <div class="itemgroup info">
          <figure class="fig fignone" id="v9893974__fig_2">
            <img class="image" src="lsa-make-jbod-choices.png">
          </figure>
        </div>
        <ul class="ul choices" id="v9893974__choices_2">
          <li class="li choice"><span class="ph uicontrol">安全</span> （默认）- 确保物理磁盘安全。
            <div class="note note note_note" id="v9893974__note_1"><span class="note__title">注意：</span> 当一个 UG 物理磁盘已受到保护并且用户想要将磁盘转换为 JBOD 时，默认情况下会选中“安全”。 </div>
          </li>
          <li class="li choice"><span class="ph uicontrol">加密擦除（符合 FIPS，警告数据丢失）。</span> – 擦除物理磁盘并转换为 JBOD。</li>
        </ul>
      </li></ol>
  </div>
