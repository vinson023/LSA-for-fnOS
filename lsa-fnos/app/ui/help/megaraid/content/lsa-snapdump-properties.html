  <h1 class="title topictitle1" id="ariaid-title1">Snapdump PL 日志</h1>
  
  <div class="body conbody">
    <p class="p">LSA 软件可以选择启用或禁用从初始发现中捕获 PL 日志。 启用后，固件强制收集 PL 缓冲区日志作为 Snapdump 日志的一部分。 </p>
    <ol class="ol" id="concept.dita_7a21b2ba-0e2f-4687-8856-7f0429ded64b__ol_1">
      <li class="li">要启用 PL 日志，请选择 <span class="ph uicontrol">捕获当日 PL 日志状态</span> 复选框。</li>
      <li class="li">单击 <span class="ph uicontrol">保存</span>。</li>
    </ol>
    <figure class="fig fignone" id="concept.dita_7a21b2ba-0e2f-4687-8856-7f0429ded64b__fig_2"><figcaption><span class="fig--title-label">图 1. </span>设置 Snapdump 属性</figcaption>
      
      <img class="image" height="350" src="LSA_snapdump_pl_log.png" width="650">
    </figure>
  </div>
