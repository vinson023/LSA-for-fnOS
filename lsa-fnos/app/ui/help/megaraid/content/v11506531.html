  <h1 class="title topictitle1" id="v11506531__v11506532">隐藏虚拟磁盘</h1>
  
  
  <div class="body taskbody" id="v11506531__v11506544"><p class="shortdesc">您可以隐藏控制器上的虚拟磁盘。</p>
    <section class="section context" id="v11506531__v11506545">
      <div class="note note note_note"><span class="note__title">注意：</span> SAS4xxx 控制器不支持隐藏虚拟磁盘。</div>
      <p class="p" id="v11506531__v11506547">执行以下步骤隐藏虚拟磁盘：</p>
    </section>
    <ol class="ol steps" id="v11506531__v11506548"><li class="li step stepexpand" id="v11506531__v11506665">
        <span class="ph cmd" id="v11506531__v11506666">导航到控制器仪表板，然后单击 <span class="keyword wintitle" id="v11506531__v11506667">磁盘组</span> （例如，<span class="ph uicontrol" id="v11506531__v11506668">DG_1</span>）。</span>
      </li><li class="li step stepexpand" id="v11506531__v11506669">
        <span class="ph cmd" id="v11506531__v11506670">单击 <img class="image" height="12" src="LSA_expand_button_icon.png" width="14"> 与磁盘组对应的图标以显示其内容。</span>
        <div class="itemgroup info" id="v11506531__v11506672">将显示与所选磁盘组关联的虚拟磁盘。</div>
      </li><li class="li step stepexpand" id="v11506531__v11506551">
        <span class="ph cmd" id="v11506531__v11506552">选择您要隐藏的虚拟磁盘。</span>
      </li><li class="li step stepexpand" id="v11506531__v11506553">
        <span class="ph cmd" id="v11506531__v11506554">选择 <span class="ph menucascade" id="v11506531__v11506673"><span class="ph uicontrol" id="v11506531__v11506674">操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v11506531__v11506675">更多操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v11506531__v11506676">隐藏</span></span>。</span>
        <div class="itemgroup info" id="v11506531__v11506556">
          <p class="p" id="v11506531__v11506557">出现一个消息框，要求您确认操作。</p>
        </div>
      </li><li class="li step stepexpand" id="v11506531__v11506558">
        <span class="ph cmd" id="v11506531__v11506559">单击 <span class="ph uicontrol" id="v11506531__v11506560">是</span> 确认并隐藏虚拟磁盘。</span>
      </li></ol>
  </div>
