  <h1 class="title topictitle1" id="v25012438__v10985167">Snapdump 功能支持</h1>
  
  <div class="body refbody" id="v25012438__v10985131">
    <section class="section" id="v25012438__v10985132">
      <p class="p" id="v25012438__v25008094">通过 Snapdump 功能支持，用户可以启用或禁用 Snapdump 功能。启用后，用户可以设置 Snapdump 的 <code class="ph codeph">CacheOffloadLimit</code> 属性；禁用后，<code class="ph codeph">CacheOffloadLimit</code> 修改将不再适用，并且在客户端级别被禁用。</p>
      <figure class="fig fignone" id="v25012438__v25013031"><figcaption><span class="fig--title-label">图 1. </span>Snapdump 属性菜单</figcaption>
        
        <img class="image" id="v25012438__image_1" height="379" src="LSA8-Snapdump-Properties.png" width="650">
      </figure>
      <p class="p">用户可以从以下位置设置 Snapdump 属性 <span class="ph uicontrol" id="v25012438__v25181419">Snapdump 操作</span> 控制器仪表板的菜单。</p>
      <p class="p" id="v25012438__v26587734">使用高级软件时可以编辑 Snapdump 属性。</p>
    </section>
  </div>
