  <h1 class="title topictitle1" id="v9156908__v9156909">分配全局热备盘</h1>
  
  <div class="body taskbody" id="v9156908__v9156922">
    <section class="section context" id="v9156908__v9156923">
      <p class="p" id="v9156908__v9374210">只要全局热备盘的容量等于或大于故障物理磁盘的强制容量，全局热备盘就会替换任何冗余阵列中的故障物理磁盘。</p>
      <p class="p" id="v9156908__v12834879">执行以下步骤来分配全局热备盘。</p>
    </section>
    <ol class="ol steps" id="v9156908__v9156924"><li class="li step stepexpand" id="v9156908__v9156925">
        <span class="ph cmd" id="v9156908__v9156926">导航到控制器仪表板，然后单击 <span class="ph uicontrol" id="v9156908__v9374211">磁盘</span> 选项卡。</span>
        <div class="itemgroup stepresult" id="v9156908__v9374212">将显示所有关联的磁盘。</div>
      </li><li class="li step stepexpand" id="v9156908__v9374213">
        <span class="ph cmd" id="v9156908__v9374214">展开 <span class="ph uicontrol" id="v9156908__v9612116">未配置的磁盘</span>，然后选择一个未配置的良好物理磁盘。</span>
      </li><li class="li step stepexpand" id="v9156908__v9896849">
        <span class="ph cmd" id="v9156908__v9896850">选择 <span class="ph menucascade" id="v9156908__v9896851"><span class="ph uicontrol" id="v9156908__v9896933">磁盘操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9156908__v9896853">分配全局热备盘</span></span>。</span>
        <div class="itemgroup stepresult" id="v9156908__v9896854">所选未配置的良好物理磁盘将变更为全局热备盘，并显示在 <span class="ph uicontrol" id="v9156908__v9896855">热备盘</span> 部分。</div>
      </li></ol>
  </div>
