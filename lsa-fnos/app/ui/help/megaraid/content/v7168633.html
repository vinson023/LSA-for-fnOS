    <p class="p">在此页面中，您可以致电技术支持代表，或提交新的服务请求并查看其状态。</p>
    <p class="p"><strong class="ph b">电话支持： </strong><a class="xref" href="https://www.broadcom.com/support/call-us" target="_blank">致电我们获取存储支持</a></p>

    <p class="p">00-800-5745-6442（国际）</p>
