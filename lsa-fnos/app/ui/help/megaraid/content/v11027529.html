  <h1 class="title topictitle1" id="v11027529__v11027530">自定义 LSI 存储管理软件的主题</h1>
  
  
  <div class="body conbody" id="v11027529__v11027543"><p class="shortdesc">您可以自定义 LSI 存储管理软件的主题，以创建与您组织的品牌相匹配的统一外观和风格。</p>
    <div class="p" id="v11027529__v11027665">例如，您可以添加公司徽标或更改默认颜色。主题颜色在整个软件中全局应用。您可以更改以下主题：
      <ul class="ul" id="v11027529__v11027666">
        <li class="li" id="v11027529__v11027667">公司标志</li>
        <li class="li" id="v11027529__v11027669">标题或横幅背景颜色</li>
      </ul>
    </div>
  </div>
