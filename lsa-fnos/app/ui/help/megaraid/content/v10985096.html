  <h1 class="title topictitle1" id="v10985096__v10985097">监控磁盘柜</h1>
  
  <div class="body conbody" id="v10985096__v10985110">
    <p class="p" id="v10985096__v10985116">当 LSI 存储管理软件运行时，您可以监控连接到服务器中控制器的所有磁盘柜的状态。</p>
    <p class="p">下图包括 <span class="keyword wintitle">槽位状态</span> 列。此列指示磁盘柜的插槽状态。可能的值包括： </p>
    <ul class="ul" id="v10985096__ul_1">
      <li class="li">正常</li>
      <li class="li">异常</li>
      <li class="li">无法访问。</li>
    </ul>
