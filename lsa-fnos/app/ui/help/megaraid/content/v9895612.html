  <h1 class="title topictitle1" id="v9895612__v9895613">禁用安全性</h1>
  
  <div class="body taskbody" id="v9895612__v9895626">
    <section class="section context" id="v9895612__v9895627">
      <div class="note attention note_attention" id="v9895612__v10321975"><span class="note__title">注意：</span> 禁用安全性后，现有数据将不再受到保护，且无法创建新的安全虚拟磁盘。禁用安全性不会影响外来磁盘上数据的安全状态。导入此前移除的受保护磁盘时，仍必须输入密码；否则无法访问其数据。控制器上存在安全磁盘组时，无法禁用安全性；尝试此操作将显示警告对话框。要禁用安全性，必须先删除所有安全磁盘组上的虚拟磁盘。</div>
      <p class="p" id="v9895612__v10321976">执行以下步骤以禁用磁盘安全性：</p>
    </section>
    <ol class="ol steps" id="v9895612__v9895628"><li class="li step stepexpand" id="v9895612__v10321977">
        <span class="ph cmd" id="v9895612__v10321978">在控制器仪表板中，选择 <span class="ph menucascade" id="v9895612__v10321979"><span class="ph uicontrol" id="v9895612__v10321980">更多操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9895612__v10321981">禁用安全性</span></span>。</span>
        <div class="itemgroup stepresult" id="v9895612__v10321982">将出现一条警告消息，要求您确认。</div>
      </li><li class="li step stepexpand" id="v9895612__v10321983">
        <span class="ph cmd" id="v9895612__v10321984">选择 <span class="ph uicontrol" id="v9895612__v10321985">确认</span>，然后单击 <span class="ph uicontrol" id="v9895612__v10321986">是，禁用安全性</span>。</span>
        <div class="itemgroup stepresult" id="v9895612__v10321987">该软件禁用磁盘安全性。</div>
      </li></ol>
  </div>
