  <h1 class="title topictitle1" id="v13215438__v13215439">禁用主机硬件 RAID 控制器</h1>
  
  <div class="body taskbody" id="v13215438__v13215451">
    <section class="section context" id="v13215438__v13215452">要禁用 HHRC，请按顺序输入以下命令：</section>
    <ol class="ol steps" id="v13215438__v13215453"><li class="li step stepexpand" id="v13215438__v13215454">
        <span class="ph cmd" id="v13215438__v13215455"><span class="keyword cmdname" id="v13215438__v13215503"># esxcli 系统设置高级列表 | grep CIMvmw_hhrcwrapperProviderEnabled</span></span>
        <div class="itemgroup info" id="v13215438__v13215504"><code class="ph codeph" id="v13215438__v13215506">[<var class="keyword varname" id="v13215438__v25181379">回报</var>]</code></div>
        <div class="itemgroup info" id="v13215438__v13215507">
          <p class="p" id="v13215438__v13215508"><span class="ph filepath" id="v13215438__v13215509">路径：/UserVars/CIMvmw_hhrcwrapperProviderEnabled</span></p>
        </div>
      </li><li class="li step stepexpand" id="v13215438__v13215510">
        <span class="ph cmd" id="v13215438__v13215511"><span class="keyword cmdname" id="v13215438__v13215512"># esxcli 系统设置高级 set -o /UserVar/CIMvmw_hhrcwrapperProviderEnabled -i 0</span></span>
      </li><li class="li step stepexpand" id="v13215438__v13215513">
        <span class="ph cmd" id="v13215438__v13215514"><span class="keyword cmdname" id="v13215438__v13215515"># /etc/init.d/sfcbd-watchdog 重新启动</span></span>
      </li></ol>
  </div>
