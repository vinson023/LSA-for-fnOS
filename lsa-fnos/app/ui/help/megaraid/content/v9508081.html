  <h1 class="title topictitle1" id="v9508081__v9508082">更改 nginx Web 服务器端口号</h1>
  
  <div class="body taskbody" id="v9508081__v9508088">
    <section class="section context" id="v9508081__v9508089">
      <p class="p" id="v9508081__v9508090">执行以下步骤更改 nginx Web 服务器端口号。</p>
    </section>
    <ol class="ol steps" id="v9508081__v9508091"><li class="li step" id="v9508081__v9508102">
        <span class="ph cmd" id="v9508081__v9508103">打开 <span class="ph filepath" id="v9508081__v9508104">nginx.conf</span> 文件在 <span class="ph filepath" id="v9508081__v9508105">LSIStorageAuthority/服务器/conf</span> 目录。</span>
      </li><li class="li step" id="v9508081__v9508106">
        <span class="ph cmd" id="v9508081__v9508107">将所有 <code class="ph codeph" id="v9508081__v13065232">listen 2463 default_server ssl</code> 实例替换为 <code class="ph codeph" id="v9508081__v13065233">listen &lt;<var class="keyword varname" id="v9508081__v13065234">新端口</var>&gt; default_server ssl</code>。</span>
      </li><li class="li step" id="v9508081__v9508110">
        <span class="ph cmd" id="v9508081__v9508111">保存 <span class="ph filepath" id="v9508081__v9508112">nginx.conf</span> 文件。</span>
      </li><li class="li step" id="v9508081__v9508113">
        <span class="ph cmd" id="v9508081__v9508114">重新启动 nginx 服务和 LSI 存储管理服务。</span>
      </li></ol>
  </div>
