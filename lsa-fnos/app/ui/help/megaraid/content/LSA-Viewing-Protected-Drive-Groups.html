  <h1 class="title topictitle1" id="ariaid-title1">查看受保护的磁盘组</h1>
  
  <div class="body taskbody">
    <section class="section context">
      <p class="p" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__v12834879">执行以下步骤可查看受保护的磁盘组列表。</p>
    </section>
    <ol class="ol steps" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__v9156924"><li class="li step stepexpand" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__v9156925">
        <span class="ph cmd" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__v9156926">导航到控制器仪表板，然后单击 <span class="ph uicontrol" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__v9374211">磁盘</span> 选项卡。</span>
        <div class="itemgroup stepresult" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__v9374212">将显示所有关联的磁盘。</div>
      </li><li class="li step stepexpand" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__v9374213">
        <span class="ph cmd" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__v9374214">展开 <span class="ph uicontrol" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__v9612116">热备盘</span>，然后选择一个物理磁盘。</span>
        <div class="itemgroup info">
          <figure class="fig fignone" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__fig_3"><figcaption><span class="fig--title-label">图 1. </span>显示受保护的磁盘组</figcaption>
            
            <img class="image" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__image_8" height="195" src="Show-Protected-DG.png" width="600">
          </figure>
        </div>
      </li><li class="li step stepexpand" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__v9896849">
        <span class="ph cmd" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__v9896850">选择 <span class="ph menucascade" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__v9896851"><span class="ph uicontrol" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__v9896933">磁盘操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__v9896853">显示受保护的磁盘组</span></span>。</span>
        <div class="itemgroup stepresult" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__v9896854">将显示 <span class="keyword wintitle">磁盘组</span> 列表。
          <figure class="fig fignone" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__fig_5"><figcaption><span class="fig--title-label">图 2. </span>受保护的磁盘组</figcaption>
            
            <img class="image" id="task.dita_6749c330-df3a-40d3-8e58-a28bee7ad5f1__image_7" height="255" src="Protected-Drive-Group.png" width="350">
          </figure>
        </div>
      </li></ol>
  </div>
