  <h1 class="title topictitle1" id="v9893874__v9893875">监控 阵列卡电池/超级电容</h1>
  
  <div class="body conbody" id="v9893874__v9893888">
    <p class="p" id="v9893874__v9897703">当 LSI 存储管理软件运行时，您可以监控连接到服务器控制器的所有 阵列卡电池/超级电容 状态。</p>
    <section class="section" id="v9893874__v9897704"><strong class="ph b">学习周期</strong>
      <p class="p" id="v9893874__v9897705">学习周期是控制器定期执行的 阵列卡电池/超级电容 校准操作，以确定 阵列卡电池/超级电容 的状况。您可以手动或自动启动学习周期。要选择自动学习周期，请启用自动学习周期功能。如果启用自动学习周期，则可以将学习周期的开始延迟最多 168 小时（7 天）。</p>
    </section>
  </div>
