  <h1 class="title topictitle1" id="v10797573__v10797574">管理硬件组件</h1>
  
  
  <div class="body conbody" id="v10797573__v10797587"><p class="shortdesc">LSI 存储管理软件使您能够管理与控制器关联的硬件组件。</p>
    <p class="p" id="v10797573__v10797600">当您选择 <span class="ph uicontrol" id="v10797573__v10797601">其他硬件</span> 在控制器仪表板中的选项卡中，将显示与控制器关联的硬件组件。
      
    </p>
