  <h1 class="title topictitle1" id="v9894010__v9894011">启动巡检读取操作</h1>
  
  <div class="body taskbody" id="v9894010__v9894024">
    <section class="section context" id="v9894010__v9894025">
      <p class="p" id="v9894010__v9895349">执行以下步骤来启动巡检读取操作。</p>
    </section>
    <ol class="ol steps" id="v9894010__v9894026"><li class="li step stepexpand" id="v9894010__v9894027">
        <span class="ph cmd" id="v9894010__v9895341">在控制器仪表板中，选择 <span class="ph menucascade" id="v9894010__v9895342"><span class="ph uicontrol" id="v9894010__v9895343">更多操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9894010__v9895344">开始巡检读取</span></span>。</span>
        <div class="itemgroup stepresult" id="v9894010__v9895345">出现警告消息。</div>
      </li><li class="li step stepexpand" id="v9894010__v9895346">
        <span class="ph cmd" id="v9894010__v9895347">单击 <span class="ph uicontrol" id="v9894010__v9895348">开始巡检读取</span> 启动巡检读取操作。</span>
        <div class="itemgroup stepresult" id="v9894010__v9933593">您可以监控巡检读取操作的进度。请参阅 <a class="xref" href="v9895285.html#v9895285" title="本节介绍 LSI 存储管理软件支持的后台操作。">后台操作支持</a>。</div>
      </li></ol>
  </div>
