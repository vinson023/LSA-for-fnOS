  <h1 class="title topictitle1" id="v9896759__v9896760">重建磁盘</h1>
  
  <div class="body taskbody" id="v9896759__v9896773">
    <section class="section context" id="v9896759__v9896774">
      <p class="p" id="v9896759__v9896977">如果 RAID 1、5、6、10、50 或 60 配置中的磁盘发生故障，LSI 存储管理软件会自动在热备盘上重建数据，以防止数据丢失。重建是全自动过程。您可以在 <span class="ph uicontrol" id="v9896759__v9897777">后台进程正在进行中</span> 窗口中监控磁盘重建进度。请参阅 <a class="xref fm:ParaText" href="v9895285.html#v9895285" title="本节介绍 LSI 存储管理软件支持的后台操作。">后台操作支持</a>。</p>
    </section>
  </div>
