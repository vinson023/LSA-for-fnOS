  <h1 class="title topictitle1" id="v9897634__v9897635">刷新属性</h1>
  
  <div class="body taskbody" id="v9897634__v9897648">
    <section class="section context" id="v9897634__v9897649">一些属性，例如温度和电压 <span class="ph uicontrol" id="v9897634__v9897836">属性</span> 部分，不自动刷新。您必须手动刷新 <span class="ph uicontrol" id="v9897634__v9933776">属性</span> 部分查看最新数据。
      <p class="p" id="v9897634__v12834896">执行以下步骤刷新数据。</p>
    </section>
    <ol class="ol steps" id="v9897634__v9897822"><li class="li step stepexpand" id="v9897634__v9897823">
        <span class="ph cmd" id="v9897634__v9897824">导航到控制器仪表板，然后单击 <span class="ph uicontrol" id="v9897634__v9897825">其他硬件</span> 选项卡。</span>
        <div class="itemgroup stepresult" id="v9897634__v9897826">所有连接到控制器的相关硬件都会出现。</div>
      </li><li class="li step stepexpand" id="v9897634__v9897827">
        <span class="ph cmd" id="v9897634__v9897828">展开 <span class="ph uicontrol" id="v9897634__v9897829">阵列卡电池/超级电容</span>，然后选择 阵列卡电池/超级电容。</span>
      </li><li class="li step stepexpand" id="v9897634__v9897830">
        <span class="ph cmd" id="v9897634__v9897831">选择 <span class="ph menucascade" id="v9897634__v9897832"><span class="ph uicontrol" id="v9897634__v9897833">操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9897634__v9897834">刷新属性</span></span>。</span>
        <div class="itemgroup stepresult" id="v9897634__v9897835">属性已更新。</div>
      </li></ol>
  </div>
