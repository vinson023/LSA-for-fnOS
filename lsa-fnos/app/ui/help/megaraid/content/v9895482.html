  <h1 class="title topictitle1" id="v9895482__v9895483">停用试用软件</h1>
  
  <div class="body taskbody" id="v9895482__v10038110">
    <section class="section context" id="v9895482__v10038111">
      <p class="p" id="v9895482__v10038112">当您想要停用试用软件时，请使用 <span class="keyword wintitle" id="v9895482__v10038113">停用所有试用软件</span> 向导。</p>
      <p class="p" id="v9895482__v10038114">执行以下步骤以启用停用试用软件按钮：</p>
    </section>
    <ol class="ol steps" id="v9895482__v10038115"><li class="li step stepexpand" id="v9895482__v10038116">
        <span class="ph cmd" id="v9895482__v10038117">单击 <span class="ph uicontrol" id="v9895482__v10038118">停用所有试用软件</span> 在 <span class="keyword wintitle" id="v9895482__v10038119">高级功能</span> 窗口。</span>
        <div class="itemgroup info" id="v9895482__v10038120">
          <p class="p" id="v9895482__v10038121">出现确认对话框。</p>
          
        </div>
      </li><li class="li step stepexpand" id="v9895482__v10038124">
        <span class="ph cmd" id="v9895482__v10038125">选择 <span class="ph uicontrol" id="v9895482__v10038126">您确定要停用吗？</span> 复选框，如果您想要停用使用试用密钥的软件应用程序。</span>
      </li><li class="li step stepexpand" id="v9895482__v10038127">
        <span class="ph cmd" id="v9895482__v10038128">单击 <span class="ph uicontrol" id="v9895482__v10038129">保存</span>。</span>
        <div class="itemgroup info" id="v9895482__v10038130">
          <p class="p" id="v9895482__v10038131">试用软件已停用。</p>
        </div>
      </li></ol>
  </div>
