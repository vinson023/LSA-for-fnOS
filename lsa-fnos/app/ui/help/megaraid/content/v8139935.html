  <h1 class="title topictitle1" id="v8139935__v8139936">清除配置</h1>
  
  <div class="body taskbody" id="v8139935__v8139937">
    <section class="section context" id="v8139935__v8139938">
      <p class="p" id="v8139935__v8139939">您可以清除所选控制器上的所有现有配置。</p>
      <div class="note note note_note" id="v8139935__note_1"><span class="note__title">注意：</span> 当存在 OS、文件系统或未知引导分区时， <span class="ph uicontrol" id="v8139935__uicontrol_1">清除配置</span> 无法执行该命令。</div>
    </section>
    <ol class="ol steps" id="v8139935__v8139942"><li class="li step stepexpand" id="v8139935__v8139943">
        <span class="ph cmd" id="v8139935__v8139944">导航到您想要清除其配置的控制器仪表板。</span>
      </li><li class="li step stepexpand" id="v8139935__v8139946">
        <span class="ph cmd" id="v8139935__v8139947">单击 <span class="ph uicontrol" id="v8139935__v8139948">配置</span> 然后单击 <span class="ph uicontrol" id="v8139935__v8139960">清除配置</span>。</span>
        <div class="itemgroup info" id="v8139935__v8139949">
          <p class="p">将显示一条确认消息。</p>
          
        </div>
      </li><li class="li step stepexpand" id="v8139935__v8139950">
        <span class="ph cmd" id="v8139935__v8139951">选中 <span class="ph uicontrol" id="v8139935__v9374209">确认</span> 复选框，然后单击 <span class="ph uicontrol" id="v8139935__v8139961">是，清除配置</span> 清除控制器上的所有现有配置。</span>
      </li></ol>
  </div>
