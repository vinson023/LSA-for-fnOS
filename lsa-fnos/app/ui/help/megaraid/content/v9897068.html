  <h1 class="title topictitle1" id="v9897068__v9897069">安全擦除磁盘</h1>
  
  <div class="body taskbody" id="v9897068__v9897082">
    <section class="section context" id="v9897068__v9897083">
      <p class="p" id="v9897068__v9897611">即时安全擦除功能可擦除加密磁盘中的数据。</p>
      <div class="note attention note_attention" id="v9897068__v9897612"><span class="note__title">注意：</span> 擦除磁盘后，磁盘上的所有数据都会丢失。在开始此操作之前，请备份您想要保留的所有数据。</div>
    </section>
    <ol class="ol steps" id="v9897068__v9897613"><li class="li step stepexpand" id="v9897068__v9897614">
        <span class="ph cmd" id="v9897068__v9897615">导航到控制器仪表板，然后单击 <span class="ph uicontrol" id="v9897068__v9897616">磁盘</span> 选项卡。</span>
        <div class="itemgroup stepresult" id="v9897068__v9897617">将显示所有关联的磁盘。</div>
      </li><li class="li step stepexpand" id="v9897068__v9897618">
        <span class="ph cmd" id="v9897068__v9897619">展开 <span class="ph uicontrol" id="v9897068__v9897620">未配置的磁盘</span>，然后选择一个未配置的良好物理磁盘。</span>
      </li><li class="li step stepexpand" id="v9897068__v9897621">
        <span class="ph cmd" id="v9897068__v9897622">选择 <span class="ph menucascade" id="v9897068__v9897623"><span class="ph uicontrol" id="v9897068__v9897624">磁盘操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9897068__v9897625">即时安全擦除</span></span>。</span>
        <div class="itemgroup stepresult" id="v9897068__v9897626">将显示一条确认消息。</div>
      </li><li class="li step stepexpand" id="v9897068__v9897627">
        <span class="ph cmd" id="v9897068__v9897628">选中 <span class="ph uicontrol" id="v9897068__v9897629">确认</span> 复选框，然后单击 <span class="ph uicontrol" id="v9897068__v9897630">是，安全擦除磁盘</span> 继续操作。</span>
        <div class="itemgroup stepresult" id="v9897068__v9897818">安全擦除操作开始后，<span class="ph uicontrol" id="v9897068__uicontrol_1">磁盘操作</span> 菜单中的 <span class="ph uicontrol" id="v9897068__v9897819">停止擦除</span> 选项将启用。您可以监控擦除操作的进度。请参阅 <a class="xref fm:ParaText" href="v9895285.html#v9895285" title="本节介绍 LSI 存储管理软件支持的后台操作。">后台操作支持</a>。</div>
      </li></ol>
  </div>
