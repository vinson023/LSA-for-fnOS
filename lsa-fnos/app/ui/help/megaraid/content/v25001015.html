  <h1 class="title topictitle1" id="v25001015__v11483349">UNMAP 功能特性</h1>
  
  <div class="body conbody" id="v25001015__v11483362">
    <p class="p">UNMAP 是与精简配置存储阵列配合使用的 SCSI 命令。在精简配置环境中，数据标记为已删除后，存储阵列仍可能保留已分配空间；由于阵列不知道这些数据已删除，空间利用率会降低。UNMAP 允许应用程序或操作系统通知存储阵列哪些磁盘块中的数据已删除，以便阵列取消分配这些块，从而回收已分配或已使用的空间。此功能可让精简配置自动清理，提高空间利用效率。</p>
    <p class="p"></p>
