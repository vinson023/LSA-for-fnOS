  <h1 class="title topictitle1" id="ariaid-title1">磁盘起转</h1>
  
  <div class="body taskbody">
    <section class="section context">
      <p class="p">LSI 存储管理软件可显示磁盘信息。必须先使磁盘起转才能查看完整信息。</p>
      <p class="p">执行以下步骤来起转磁盘。</p>
    </section>
    <ol class="ol steps"><li class="li step stepexpand" id="task.dita_2462bdc0-33cd-4e4d-b667-f76eac088b54__v8144008">
        <span class="ph cmd" id="task.dita_2462bdc0-33cd-4e4d-b667-f76eac088b54__v8144009">导航到控制器仪表板。</span>
      </li><li class="li step stepexpand">
        <span class="ph cmd">选择 <span class="ph menucascade"><span class="ph uicontrol">更多操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol">电源状态操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol">启动/起转磁盘</span></span>。</span>
        <div class="itemgroup stepresult">将显示 <span class="keyword wintitle">启动/起转磁盘</span> 窗口。
          <figure class="fig fignone" id="task.dita_2462bdc0-33cd-4e4d-b667-f76eac088b54__fig_5"><figcaption><span class="fig--title-label">图 1. </span>启动/起转磁盘</figcaption>
            
            <img class="image" id="task.dita_2462bdc0-33cd-4e4d-b667-f76eac088b54__image_8" height="327" src="LSA-start-spinup-drives.png" width="650">
          </figure>
        </div>
      </li><li class="li step stepexpand">
        <span class="ph cmd">选择要起转的磁盘。</span>
      </li><li class="li step stepexpand">
        <span class="ph cmd">单击 <span class="ph uicontrol">启动/起转磁盘</span>。</span>
        <div class="itemgroup stepresult">将显示两个警告对话框。</div>
      </li><li class="li step stepexpand">
        <span class="ph cmd">在以下对话框中单击 <span class="ph uicontrol">是</span>。</span>
        <div class="itemgroup info" id="task.dita_2462bdc0-33cd-4e4d-b667-f76eac088b54__choices_1">
          <pre class="pre msgblock">启动或起转多个磁盘可能需要一些时间。确定要启动或起转这些磁盘吗？</pre>
        </div>
      </li></ol>
  </div>
