  <h1 class="title topictitle1" id="ariaid-title1">替换缺失的磁盘</h1>
  
  <div class="body taskbody">
    <section class="section context">
      <p class="p"></p>
    </section>
    <ol class="ol steps"><li class="li step">
        <span class="ph cmd">导航到控制器仪表板并选择 <span class="ph uicontrol">磁盘组</span>。</span>
      </li><li class="li step">
        <span class="ph cmd">为具有两个磁盘的任何 RAID 级别创建新磁盘组。</span>
      </li><li class="li step">
        <span class="ph cmd">导航到磁盘组，并将磁盘组 0 中的物理磁盘之一标记为脱机。</span>
      </li><li class="li step">
        <span class="ph cmd">选择标记为脱机的物理磁盘，然后单击 <span class="ph uicontrol">将磁盘标记为丢失</span>。</span>
      </li><li class="li step">
        <span class="ph cmd">选择 <span class="ph uicontrol">未配置的磁盘</span>，然后选择物理磁盘，然后 <span class="ph uicontrol">替换缺失的磁盘</span>。</span>
      </li><li class="li step">
        <span class="ph cmd">选择包含丢失物理磁盘的磁盘组。</span>
      </li><li class="li step">
        <span class="ph cmd">单击 <span class="ph uicontrol">确定</span>。</span>
      </li></ol>
  </div>
