  <h1 class="title topictitle1" id="v10548621__v10548622">启用和禁用 SSD 防护</h1>
  
  <div class="body taskbody" id="v10548621__v10548635">
    <section class="section context" id="v10548621__v10548636">固态硬盘 (SSD) 以其可靠性和性能而闻名。MegaRAID 控制器的 SSD Guard 技术可在 SSD 可能发生故障时，自动将数据复制到指定的热备盘或新插入的物理磁盘，从而提高 SSD 的可靠性。预测性故障事件通知或 SMART 命令会自动启动重建，以帮助保留运行状况不佳或性能下降的 SSD 上的数据。</section>
    <ol class="ol steps" id="v10548621__v10548637"><li class="li step" id="v10548621__v10548656">
        <span class="ph cmd" id="v10548621__v10548657">在控制器仪表板中，选择 <span class="ph menucascade" id="v10548621__v10548658"><span class="ph uicontrol" id="v10548621__v10548659">更多操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v10548621__v10548660">启用 SSD 防护</span></span> 启用 SSD 防护功能。</span>
      </li><li class="li step" id="v10548621__v10548661">
        <span class="ph cmd" id="v10548621__v10548662">要禁用 SSD Guard 功能，请选择 <span class="ph menucascade" id="v10548621__v10548663"><span class="ph uicontrol" id="v10548621__v10548664">更多操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v10548621__v10548665">禁用 SSD 防护</span></span>。</span>
      </li></ol>
  </div>
