  <h1 class="title topictitle1" id="v9894167__v9894168">运行一致性检查</h1>
  
  <div class="body conbody" id="v9894167__v9894181">
    <p class="p" id="v9894167__v9894210">一致性检查操作验证使用 RAID 1、5、6、10、50 和 60 配置的虚拟磁盘中数据的正确性。例如，在具有奇偶校验的系统中，检查一致性意味着计算一个磁盘上的数据并将结果与​​奇偶校验磁盘的内容进行比较。您应该定期对容错虚拟磁盘运行一致性检查。</p>
    <p class="p" id="v9894167__v11708907">由于 RAID 0 不提供数据冗余，因此您无法对这些 RAID 虚拟磁盘运行一致性检查。</p>
    <p class="p" id="v9894167__v9894212">要运行一致性检查，您必须首先设置一致性检查属性，然后您可以计划按您选择的定义时间间隔运行一致性检查，也可以立即启动一致性检查操作。</p>
  </div>
