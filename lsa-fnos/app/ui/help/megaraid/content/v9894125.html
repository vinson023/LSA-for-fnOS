  <h1 class="title topictitle1" id="v9894125__v9894126">下载 TTY 日志</h1>
  
  <div class="body taskbody" id="v9894125__v9894139">
    <section class="section context" id="v9894125__v9894140">
      <p class="p" id="v9894125__v9895958">您可以下载 TTY 日志文件，其中包含控制器固件端的终端日志条目。日志信息显示固件端可用的条目总数。</p>
      <p class="p" id="v9894125__v12831618">执行以下操作来下载 TTY 日志文件。</p>
    </section>
    <div class="li step p" id="v9894125__v9894142">
        <span class="ph cmd" id="v9894125__v9895959">在控制器仪表板中，选择 <span class="ph menucascade" id="v9894125__v9895960"><span class="ph uicontrol" id="v9894125__v9895961">更多操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9894125__v9895962">下载 TTY 日志</span></span>。</span>
        <div class="itemgroup stepresult" id="v9894125__v9895963">下载 TTY 日志文件，其中包含控制器的序列号。下面以 TTY 日志文件的格式为例。</div>
      </div>
    <div class="example" id="v9894125__v13070351"><strong class="ph b">示例</strong>: <code class="ph codeph" id="v9894125__v13070352">Json_&lt;<var class="keyword varname" id="v9894125__v13070638">控制器序列号</var>&gt;_TTY.txt</code></div>
  </div>
