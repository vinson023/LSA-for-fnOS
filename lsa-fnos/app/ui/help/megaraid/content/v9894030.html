  <h1 class="title topictitle1" id="v9894030__v9894031">设置一致性检查属性</h1>
  
  <div class="body taskbody" id="v9894030__v9894044">
    <section class="section context" id="v9894030__v9894045">
      <p class="p" id="v9894030__v9894150">执行以下步骤来设置一致性检查的属性。</p>
    </section>
    <ol class="ol steps" id="v9894030__v9894046"><li class="li step stepexpand" id="v9894030__v9894047">
        <span class="ph cmd" id="v9894030__v9894048">在控制器仪表板中，选择 <span class="ph menucascade" id="v9894030__v9894151"><span class="ph uicontrol" id="v9894030__v9894152">更多操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9894030__v9894153">设置一致性检查属性</span></span>。</span>
        <div class="itemgroup stepresult" id="v9894030__v9894154">将显示<span class="keyword wintitle" id="v9894030__v9894155">设置一致性检查属性</span>对话框。</div>
      </li><li class="li step stepexpand" id="v9894030__v9894156">
        <span class="ph cmd" id="v9894030__v9894157">选择以下两个选项之一：</span>
        <div class="itemgroup info" id="v9894030__v9894158">
          <ul class="ul" id="v9894030__v9894159">
            <li class="li" id="v9894030__v9894160"><span class="ph uicontrol" id="v9894030__v9894161">继续一致性检查并修复错误</span> – RAID 控制器继续进行一致性检查，如果发现任何错误，则修复它们。</li>
            <li class="li" id="v9894030__v9894162"><span class="ph uicontrol" id="v9894030__v9894163">出现错误时停止一致性检查</span> – 如果发现任何错误，RAID 控制器将停止一致性检查操作。</li>
          </ul>
        </div>
      </li><li class="li step stepexpand" id="v9894030__v9894164">
        <span class="ph cmd" id="v9894030__v9894165">单击 <span class="ph uicontrol" id="v9894030__v9894166">保存</span>。</span>
      </li></ol>
  </div>
