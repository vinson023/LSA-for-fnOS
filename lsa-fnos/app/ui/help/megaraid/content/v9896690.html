  <h1 class="title topictitle1" id="v9896690__v9896691">使磁盘脱机</h1>
  
  <div class="body taskbody" id="v9896690__v9896704">
    <section class="section context" id="v9896690__v9896705">
      <p class="p" id="v9896690__v9896864">执行以下步骤将磁盘置于脱机状态。</p>
      <div class="note attention note_attention" id="v9896690__v9896865"><span class="note__title">注意：</span> 执行此过程后，磁盘上的所有数据都将丢失。</div>
    </section>
    <ol class="ol steps" id="v9896690__v9896706"><li class="li step stepexpand" id="v9896690__v9896866">
        <span class="ph cmd" id="v9896690__v9896867">导航到控制器仪表板，然后单击磁盘组名称（例如，<span class="ph uicontrol" id="v9896690__v9896868">DG_1</span>）。</span>
        <div class="itemgroup info">单击 <img class="image" id="v9896690__image_1" height="12" src="LSA_expand_button_icon.png" width="14"> 与磁盘组对应的图标以显示其内容。</div>
        <div class="itemgroup stepresult" id="v9896690__v9896870">将显示与所选磁盘组关联的虚拟磁盘和物理磁盘。</div>
      </li><li class="li step stepexpand" id="v9896690__v9896871">
        <span class="ph cmd" id="v9896690__v9896872">单击 <span class="ph uicontrol" id="v9896690__v9896873">物理磁盘</span> 选项卡，然后选择要脱机的磁盘。</span>
      </li><li class="li step stepexpand" id="v9896690__v9896874">
        <span class="ph cmd" id="v9896690__v9896875">选择 <span class="ph menucascade" id="v9896690__v9896876"><span class="ph uicontrol" id="v9896690__v9896877">磁盘操作</span><abbr title="然后"> &gt; </abbr><span class="ph uicontrol" id="v9896690__v9896878">离线</span></span>。</span>
        <div class="itemgroup stepresult" id="v9896690__v9896879">磁盘状态更改为脱机。</div>
      </li></ol>
  </div>
